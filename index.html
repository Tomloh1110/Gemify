<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0A0015;
            --neon-purple: #9D00FF;
            --neon-blue: #0038FF;
            --glass-dark: rgba(15, 0, 30, 0.7);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        /* --- 动态网格背景 --- */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(var(--neon-purple) 1px, transparent 1px),
                linear-gradient(90deg, var(--neon-purple) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.15;
            pointer-events: none;
            z-index: -1;
        }

        /* --- 背景光晕 --- */
        .glow-overlay {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(157, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 56, 255, 0.15) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }

        /* --- 霓虹文字描边 --- */
        .neon-text-stroke {
            color: white;
            -webkit-text-stroke: 2px var(--neon-purple);
            filter: drop-shadow(0 0 10px var(--neon-purple));
        }

        /* --- 霓虹渐变按钮 --- */
        .neon-btn {
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue));
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(157, 0, 255, 0.4);
        }
        .neon-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(157, 0, 255, 0.6);
        }

        /* --- 玻璃卡片 --- */
        .glass-card {
            background: var(--glass-dark);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(157, 0, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        /* --- 进化树动画 --- */
        .branch { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 4s forwards ease-out; }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        .tree-node { animation: pulse 3s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; r: 4; } 50% { opacity: 1; r: 6; } }

        /* 侧边栏收起 */
        #sidebar { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); width: 320px; }
        #sidebar.collapsed { width: 0; padding: 0; margin: 0; opacity: 0; transform: translateX(-100%); }
        
        .portal-transition { transition: all 0.6s cubic-bezier(0.7, 0, 0.3, 1); }
        .hidden-state { opacity: 0; transform: translateY(30px); pointer-events: none; }

        .role-card { transition: all 0.3s ease; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
        .role-card.active { border-color: var(--neon-purple); background: rgba(157, 0, 255, 0.1); box-shadow: 0 0 15px rgba(157, 0, 255, 0.3); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 全局固定右上角 LOGO */
        .fixed-site-logo {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 9999;
            filter: drop-shadow(0 0 10px var(--neon-purple));
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="glow-overlay"></div>

    <!-- 全局固定右上角 LOGO -->
    <div class="fixed-site-logo">
        <svg width="60" height="60" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="deep-purple-glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blurOut"/>
                    <feColorMatrix in="blurOut" type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.2  0 0 0 0 0.8  0 0 0 1 0" result="coloredBlur"/>
                    <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
            </defs>
            <g filter="url(#deep-purple-glow)" stroke="#9d72ff" stroke-width="2.5" fill="none">
                <path d="M100 30 L112 50 L100 70 L88 50 Z" fill="#9d72ff" stroke="none"/>
                <path d="M100 85 L100 180"/>
                <path d="M100 95 L85 80"/><path d="M100 95 L115 80"/>
                <path d="M100 120 L75 95 L75 85"/><path d="M100 120 L125 95 L125 85"/>
                <path d="M100 145 L60 115 L60 105"/><path d="M100 145 L140 115 L140 105"/>
                <path d="M100 170 L45 125 L45 115"/><path d="M100 170 L155 125 L155 115"/>
                <g fill="#9d72ff" stroke="none">
                    <circle cx="85" cy="80" r="4"/><circle cx="115" cy="80" r="4"/>
                    <circle cx="75" cy="85" r="4"/><circle cx="125" cy="85" r="4"/>
                    <circle cx="60" cy="105" r="4"/><circle cx="140" cy="105" r="4"/>
                    <circle cx="45" cy="115" r="4"/><circle cx="155" cy="115" r="4"/>
                </g>
            </g>
        </svg>
    </div>

    <!-- PAGE 1: HERO SECTION -->
    <section id="heroPage" class="fixed inset-0 flex flex-col md:flex-row items-center justify-center p-6 md:p-20 gap-12 z-[100] portal-transition">
        <div class="w-full md:w-1/2 flex justify-center items-center">
            <svg viewBox="0 0 400 500" class="w-full max-w-[400px] h-auto drop-shadow-2xl">
                <path d="M200 450 Q200 300 200 150" stroke="#9D00FF" stroke-width="8" fill="none" class="branch" />
                <path d="M200 350 Q100 300 80 200" stroke="#0038FF" stroke-width="4" fill="none" class="branch" style="animation-delay: 0.5s" />
                <path d="M200 300 Q300 250 320 150" stroke="#0038FF" stroke-width="4" fill="none" class="branch" style="animation-delay: 1s" />
                <circle cx="80" cy="200" r="5" fill="white" class="tree-node" />
                <circle cx="320" cy="150" r="5" fill="white" class="tree-node" style="animation-delay: 0.7s" />
                <circle cx="200" cy="50" r="5" fill="white" class="tree-node" style="animation-delay: 1.4s" />
            </svg>
        </div>
        <div class="w-full md:w-1/2 text-center md:text-left space-y-6">
            <h2 class="text-sm font-bold tracking-[0.3em] text-blue-400 uppercase">AI Evolution Engine</h2>
            <h1 class="text-8xl md:text-[10rem] font-black neon-text-stroke tracking-tighter leading-none">GEMIFY</h1>
            <p class="text-xl md:text-2xl font-light text-slate-400">Discover. Define. Dominate.</p>
            <button onclick="enterSystem()" class="neon-btn px-12 py-5 text-white font-black rounded-full flex items-center gap-3 mx-auto md:mx-0 uppercase tracking-widest">
                Enter the System <i data-lucide="zap"></i>
            </button>
        </div>
    </section>

    <!-- PAGE 1.5: NAME ENTRY -->
    <section id="nameEntryPage" class="fixed inset-0 flex flex-col items-center justify-center p-6 z-[90] portal-transition hidden hidden-state">
        <div class="max-w-md w-full text-center space-y-8 glass-card p-12 rounded-[3rem]">
            <div class="w-20 h-20 bg-purple-900/50 rounded-3xl flex items-center justify-center mx-auto border border-purple-500/50 shadow-[0_0_20px_rgba(157,0,255,0.3)]">
                <i data-lucide="fingerprint" class="text-purple-400 w-10 h-10"></i>
            </div>
            <h2 class="text-3xl font-black text-white tracking-tight uppercase">Identify Yourself</h2>
            <input type="text" id="inputName" placeholder="Enter identity..." class="w-full p-5 text-center text-xl font-bold rounded-2xl bg-black/50 border border-purple-500/30 outline-none focus:border-purple-400 text-white transition-all">
            <button onclick="proceedToAwakening()" class="neon-btn w-full py-4 text-white font-bold rounded-xl uppercase tracking-widest">Awaken Identity</button>
        </div>
    </section>

    <!-- PAGE 2: MAIN APP -->
    <main id="appPage" class="flex h-screen opacity-0 pointer-events-none hidden portal-transition relative">
        
        <button id="sidebarToggle" onclick="toggleSidebar()" class="fixed left-[335px] top-7 p-2 bg-purple-900/80 border border-purple-500/50 rounded-xl shadow-lg text-purple-400 z-[100]">
            <i id="toggleIcon" data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>

        <aside id="sidebar" class="glass-card border-r border-purple-500/20 flex flex-col p-6 z-50 relative">
            <div class="mb-6 space-y-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div id="sidebarIcon" class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-600 to-blue-600 flex items-center justify-center text-white shadow-lg"><i data-lucide="user"></i></div>
                        <div>
                            <h3 id="statName" class="font-bold text-white text-sm">Player</h3>
                            <span id="rankBadge" class="text-[9px] font-black px-2 py-0.5 bg-purple-600 text-white rounded uppercase">E Rank</span>
                        </div>
                    </div>
                    <button onclick="toggleRankGuide()" class="p-2 bg-white/5 border border-white/10 rounded-lg text-[10px] font-bold uppercase text-purple-400">Ranks</button>
                </div>
                <div id="rankGuidePopover" class="absolute left-[330px] top-6 w-64 glass-card p-5 rounded-3xl z-[100]">
                    <h4 class="text-[10px] font-black text-purple-400 uppercase tracking-widest mb-4">Rank Progression</h4>
                    <div id="rankGuideList" class="space-y-2"></div>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between text-[10px] font-black text-purple-300 uppercase"><span>Global XP</span><span id="xpText">0/100</span></div>
                    <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden"><div id="xpBar" class="h-full bg-gradient-to-r from-purple-500 to-blue-500 transition-all duration-500" style="width: 0%"></div></div>
                </div>
            </div>
            <button onclick="createNewAmbition()" class="neon-btn flex items-center justify-center gap-2 w-full py-4 mb-8 text-white rounded-2xl font-bold text-sm uppercase tracking-tighter"><i data-lucide="plus" class="w-4 h-4"></i> New Ambition</button>
            <div class="flex-1 overflow-y-auto no-scrollbar space-y-6">
                <div><h4 class="text-[10px] font-black text-purple-400 uppercase tracking-widest mb-4 px-2">Ambition Vault</h4><div id="vaultList" class="space-y-2"></div></div>
                <div><h4 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4 px-2">Archived</h4><div id="archivedList" class="space-y-2 opacity-50"></div></div>
            </div>
            <div class="mt-auto pt-6 border-t border-white/10 space-y-2">
                <button onclick="logout()" class="w-full py-3 text-[11px] font-bold text-slate-400 uppercase hover:text-white transition-all">Logout</button>
                <button onclick="resetSystem()" class="w-full py-3 text-[11px] font-bold text-red-500/70 uppercase hover:text-red-400 transition-all">Reset System</button>
            </div>
        </aside>

        <section class="flex-1 flex flex-col items-center justify-center p-12 relative overflow-y-auto">
            <div id="setupForm" class="max-w-xl w-full glass-card p-12 rounded-[3rem] space-y-8">
                <div class="text-center"><h2 class="text-3xl font-black text-white uppercase tracking-tight">Awakening System</h2><p class="text-purple-400 text-xs uppercase tracking-widest">Define your evolution path</p></div>
                <div class="space-y-6">
                    <div class="space-y-2"><label class="text-[10px] font-bold text-purple-400 uppercase ml-2">Select Role</label>
                        <div class="grid grid-cols-2 gap-4">
                            <div onclick="selectRole('Warrior')" id="role-Warrior" class="role-card active p-6 rounded-3xl bg-white/5 flex flex-col items-center gap-3"><i data-lucide="sword" class="text-purple-400"></i><span class="text-xs font-bold uppercase">Warrior</span></div>
                            <div onclick="selectRole('Mage')" id="role-Mage" class="role-card p-6 rounded-3xl bg-white/5 flex flex-col items-center gap-3"><i data-lucide="wand-2" class="text-blue-400"></i><span class="text-xs font-bold uppercase">Mage</span></div>
                        </div>
                    </div>
                    <div class="space-y-2"><label class="text-[10px] font-bold text-purple-400 uppercase ml-2">Core Ambition</label><input type="text" id="inputAmbition" placeholder="e.g. Master Software Architect" class="w-full p-5 rounded-2xl bg-black/50 border border-white/10 outline-none focus:border-purple-500 text-white"></div>
                    <button id="initBtn" onclick="startEvolution()" class="neon-btn w-full py-5 text-white font-black rounded-2xl uppercase tracking-widest">Initialize Evolution</button>
                </div>
            </div>
            <div id="dashboard" class="hidden text-center space-y-6">
                <div class="w-24 h-24 bg-gradient-to-br from-purple-600 to-blue-600 rounded-[2rem] shadow-2xl flex items-center justify-center mx-auto mb-6 animate-pulse"><i data-lucide="shield-check" class="w-12 h-12 text-white"></i></div>
                <h1 id="activeTitle" class="text-6xl md:text-8xl font-black text-white uppercase leading-none tracking-tighter"></h1>
                <p class="text-purple-400 uppercase text-sm tracking-widest">Evolution path is active</p>
                <button onclick="toggleModal(true)" class="neon-btn px-10 py-4 text-white font-bold rounded-full uppercase tracking-widest">View Quest Log</button>
            </div>
        </section>

        <aside id="resultModal" class="fixed top-4 right-4 bottom-4 w-[38%] glass-card rounded-[2.5rem] z-[60] transition-transform duration-500 translate-x-[120%] flex flex-col overflow-hidden">
            <div class="p-6 border-b border-white/10 flex justify-between items-center"><h3 class="font-black text-purple-400 uppercase text-xs tracking-widest">Evolution Path</h3><button onclick="toggleModal(false)" class="p-2 bg-white/5 rounded-xl text-white"><i data-lucide="x" class="w-4 h-4"></i></button></div>
            <div id="logContainer" class="mx-6 mt-6 p-5 system-log-glass rounded-3xl h-32 overflow-y-auto text-[11px] leading-relaxed"></div>
            <div id="taskContainer" class="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar"></div>
        </aside>
    </main>

    <script>
        const _part1 = "AIzaSyC1DSvs";
        const _part2 = "fpU_xlUf4yYro";
        const _part3 = "9UXcj_XgfR9s10";
        const _0x4a2 = _part1 + _part2 + _part3; 
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${_0x4a2}`;

        let session = { playerName: "", playerRole: "Warrior", currentId: null, ambitionVault: [], archivedVault: [] };
        const rankThresholds = [{ rank: 'E', xp: 0 }, { rank: 'D', xp: 100 }, { rank: 'C', xp: 300 }, { rank: 'B', xp: 600 }, { rank: 'A', xp: 1000 }, { rank: 'S', xp: 1500 }, { rank: 'SS', xp: 2100 }, { rank: 'SSS', xp: 3000 }];

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons(); renderRankGuide();
            const saved = localStorage.getItem('gemify_cyber_v28');
            if (saved) {
                session = JSON.parse(saved);
                if (session.ambitionVault.length > 0 || session.archivedVault.length > 0) {
                    document.getElementById('heroPage').classList.add('hidden');
                    const app = document.getElementById('appPage');
                    app.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
                    renderVaults(); if (session.currentId) loadAmbition(session.currentId);
                }
            }
        });

        function save() { localStorage.setItem('gemify_cyber_v28', JSON.stringify(session)); updateGlobalXP(); }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('sidebarToggle');
            const isCollapsed = sidebar.classList.toggle('collapsed');
            toggleBtn.style.left = isCollapsed ? '1.5rem' : '335px';
            document.getElementById('toggleIcon').setAttribute('data-lucide', isCollapsed ? 'chevron-right' : 'chevron-left');
            lucide.createIcons();
        }

        function enterSystem() {
            const hero = document.getElementById('heroPage');
            const nameEntry = document.getElementById('nameEntryPage');
            const app = document.getElementById('appPage');
            hero.classList.add('hidden-state');
            setTimeout(() => {
                hero.classList.add('hidden');
                if (session.playerName) {
                    app.classList.remove('hidden');
                    setTimeout(() => app.classList.remove('opacity-0', 'pointer-events-none'), 50);
                    document.getElementById('statName').innerText = session.playerName;
                } else {
                    nameEntry.classList.remove('hidden');
                    setTimeout(() => nameEntry.classList.remove('hidden-state'), 50);
                }
            }, 600);
        }

        function proceedToAwakening() {
            const name = document.getElementById('inputName').value.trim();
            if (!name) return;
            session.playerName = name; save();
            const nameEntry = document.getElementById('nameEntryPage');
            const app = document.getElementById('appPage');
            nameEntry.classList.add('hidden-state');
            setTimeout(() => {
                nameEntry.classList.add('hidden');
                app.classList.remove('hidden');
                setTimeout(() => app.classList.remove('opacity-0', 'pointer-events-none'), 50);
                document.getElementById('statName').innerText = session.playerName;
            }, 600);
        }

        function logout() {
            const hero = document.getElementById('heroPage');
            const app = document.getElementById('appPage');
            app.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                app.classList.add('hidden');
                hero.classList.remove('hidden', 'hidden-state');
            }, 600);
        }

        function resetSystem() {
            if (confirm("DANGER: Reset all data?")) {
                localStorage.removeItem('gemify_cyber_v28');
                location.reload();
            }
        }

        function toggleRankGuide() { document.getElementById('rankGuidePopover').classList.toggle('active'); }
        function toggleModal(show) { document.getElementById('resultModal').style.transform = show ? 'translateX(0)' : 'translateX(120%)'; }
        
        function renderRankGuide() {
            document.getElementById('rankGuideList').innerHTML = rankThresholds.map(r => `
                <div class="flex justify-between text-[11px] p-3 rounded-xl bg-white/5 border border-white/10">
                    <span class="font-bold text-purple-300">${r.rank} Rank</span><span class="font-black text-blue-400">${r.xp} XP</span>
                </div>`).reverse().join('');
        }

        function selectRole(role) {
            session.playerRole = role;
            document.getElementById('role-Warrior').classList.toggle('active', role === 'Warrior');
            document.getElementById('role-Mage').classList.toggle('active', role === 'Mage');
            document.getElementById('sidebarIcon').innerHTML = `<i data-lucide="${role === 'Warrior' ? 'sword' : 'wand-2'}"></i>`;
            lucide.createIcons();
        }

        function createNewAmbition() {
            session.currentId = null;
            document.getElementById('setupForm').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('inputAmbition').value = '';
            toggleModal(false);
        }

        async function startEvolution() {
            const title = document.getElementById('inputAmbition').value.trim();
            if (!title) return;
            const btn = document.getElementById('initBtn');
            btn.disabled = true; btn.innerText = "SYNCING...";
            toggleModal(true);
            document.getElementById('logContainer').innerHTML = `<p class="text-purple-400">> [Initializing Neural Link...]</p>`;

            try {
                const prompt = `Act as Gemify AI. Role: ${session.playerRole}. Ambition: "${title}". Break into 5 hard but actionable tasks. Return ONLY JSON array: [{"phase": "...", "name": "...", "xp": number, "search": "..."}]`;
                const response = await fetch(API_URL, { method: "POST", body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
                const data = await response.json();
                const tasks = JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json/g, "").replace(/```/g, "").trim());
                
                const id = Date.now();
                session.ambitionVault.unshift({ id, title, role: session.playerRole, tasks: tasks.map(t => ({...t, completed: false})) });
                session.currentId = id;
                
                await runLogs(title);
                document.getElementById('activeTitle').innerText = title;
                document.getElementById('setupForm').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                renderTasks(session.ambitionVault[0]); renderVaults(); save();
            } catch (e) {
                alert("AI Link Failed. Check connection.");
            } finally {
                btn.disabled = false; btn.innerText = "Initialize Evolution";
            }
        }

        async function runLogs(title) {
            const logs = [`[Engine: GEMINI_3_ACTIVE]`, `[Analyzing "${title}"...]`, `[Evolution Path Ready.]` ];
            const container = document.getElementById('logContainer');
            container.innerHTML = '';
            for (const log of logs) {
                const p = document.createElement('p'); p.className = "text-blue-400 mb-1"; p.innerText = `> ${log}`;
                container.appendChild(p); container.scrollTop = container.scrollHeight;
                await new Promise(r => setTimeout(r, 600));
            }
        }

        function loadAmbition(id) {
            session.currentId = id;
            const data = session.ambitionVault.find(a => a.id === id) || session.archivedVault.find(a => a.id === id);
            document.getElementById('activeTitle').innerText = data.title;
            document.getElementById('setupForm').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            renderTasks(data); renderVaults(); save();
        }

        function archiveAmbition(e, id) {
            e.stopPropagation();
            const idx = session.ambitionVault.findIndex(a => a.id === id);
            session.archivedVault.unshift(session.ambitionVault.splice(idx, 1)[0]);
            if (session.currentId === id) createNewAmbition();
            renderVaults(); save();
        }

        function unarchiveAmbition(e, id) {
            e.stopPropagation();
            const idx = session.archivedVault.findIndex(a => a.id === id);
            session.ambitionVault.unshift(session.archivedVault.splice(idx, 1)[0]);
            renderVaults(); save();
        }

        function renderVaults() {
            const activeList = document.getElementById('vaultList');
            const archivedList = document.getElementById('archivedList');
            activeList.innerHTML = ''; archivedList.innerHTML = '';
            session.ambitionVault.forEach(a => {
                const div = document.createElement('div');
                div.className = `sidebar-item p-4 rounded-xl text-xs font-bold flex items-center justify-between group ${session.currentId === a.id ? 'active' : ''}`;
                div.onclick = () => loadAmbition(a.id);
                div.innerHTML = `<div class="flex items-center gap-3 truncate"><i data-lucide="target" class="w-4 h-4 text-purple-400"></i><span class="truncate uppercase">${a.title}</span></div><button onclick="archiveAmbition(event, ${a.id})" class="opacity-0 group-hover:opacity-100 p-1 hover:bg-white/10 rounded-lg"><i data-lucide="archive" class="w-4 h-4 text-slate-400"></i></button>`;
                activeList.appendChild(div);
            });
            session.archivedVault.forEach(a => {
                const div = document.createElement('div');
                div.className = `sidebar-item p-4 rounded-xl text-xs font-bold flex items-center justify-between group ${session.currentId === a.id ? 'active' : ''}`;
                div.onclick = () => loadAmbition(a.id);
                div.innerHTML = `<div class="flex items-center gap-3 truncate"><i data-lucide="package" class="w-4 h-4 text-slate-500"></i><span class="truncate uppercase">${a.title}</span></div><button onclick="unarchiveAmbition(event, ${a.id})" class="opacity-0 group-hover:opacity-100 p-1 hover:bg-white/10 rounded-lg"><i data-lucide="rotate-ccw" class="w-4 h-4 text-slate-400"></i></button>`;
                archivedList.appendChild(div);
            });
            lucide.createIcons();
        }

        function renderTasks(ambition) {
            const container = document.getElementById('taskContainer'); container.innerHTML = '';
            ambition.tasks.forEach((task, index) => {
                const div = document.createElement('div');
                div.className = "p-5 rounded-2xl bg-white/5 border border-white/10 flex items-start gap-4 shadow-xl";
                div.innerHTML = `
                    <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})" class="mt-1 w-5 h-5 rounded border-purple-500 bg-black text-purple-500">
                    <div class="flex-1">
                        <span class="task-phase-tag ${task.completed ? 'text-slate-500' : 'text-purple-400'} mb-1 inline-block">${task.phase}</span>
                        <p class="text-sm font-bold ${task.completed ? 'text-slate-500 line-through' : 'text-white'}">${task.name}</p>
                        <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(task.search || task.name)}" target="_blank" class="text-[10px] text-blue-400 font-bold hover:underline flex items-center gap-1 mt-2 uppercase tracking-tighter"><i data-lucide="external-link" class="w-3 h-3"></i> Learning Node</a>
                    </div><span class="text-[10px] font-black text-blue-500">+${task.xp}XP</span>`;
                container.appendChild(div);
            });
            lucide.createIcons();
        }

        function toggleTask(index) {
            const ambition = session.ambitionVault.find(a => a.id === session.currentId) || session.archivedVault.find(a => a.id === session.currentId);
            ambition.tasks[index].completed = !ambition.tasks[index].completed; save();
        }

        function updateGlobalXP() {
            let total = 0; [...session.ambitionVault, ...session.archivedVault].forEach(a => a.tasks.forEach(t => { if (t.completed) total += t.xp; }));
            let rankIdx = 0; rankThresholds.forEach((r, i) => { if (total >= r.xp) rankIdx = i; });
            const currentRank = rankThresholds[rankIdx]; const next = rankThresholds[rankIdx + 1] || {xp: 3000};
            document.getElementById('xpText').innerText = `${total}/${next.xp}`;
            document.getElementById('xpBar').style.width = `${Math.min((total / next.xp) * 100, 100)}%`;
            document.getElementById('rankBadge').innerText = `${currentRank.rank} RANK`;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (!document.getElementById('heroPage').classList.contains('hidden')) enterSystem();
                else if (!document.getElementById('nameEntryPage').classList.contains('hidden')) proceedToAwakening();
                else if (!document.getElementById('setupForm').classList.contains('hidden')) startEvolution();
            }
        });
    </script>
</body>
</html>
