<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemify | System Awakening</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F8F9FF;
            overflow-x: hidden;
        }

        .utopian-gradient {
            background: linear-gradient(135deg, #FDFCFE 0%, #E6E6FA 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(230, 230, 250, 0.5);
        }

        .system-terminal {
            font-family: 'Fira Code', monospace;
            background: #1A1A2E;
            color: #B39DDB;
        }

        .modal-transition {
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 悬浮按钮动画 */
        .status-btn-appear {
            animation: slideInRight 0.5s forwards;
        }

        @keyframes slideInRight {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .gemify-tree-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 2px 2px, #B39DDB 1px, transparent 0);
            background-size: 40px 40px;
            opacity: 0.1;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body class="utopian-gradient text-slate-900">
    <div class="gemify-tree-overlay"></div>

    <!-- PAGE 1: HERO SECTION -->
    <section id="hero" class="relative min-h-screen flex flex-col items-center justify-center px-6 overflow-hidden">
        <div class="absolute top-20 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-[#E6E6FA] rounded-full blur-[120px] opacity-50 z-0"></div>
        
        <div class="relative z-10 text-center space-y-8">
            <div class="inline-block px-4 py-1.5 rounded-full border border-purple-200 bg-white/50 text-purple-500 text-xs font-bold tracking-[0.3em] uppercase mb-4">
                System Version 1.0.4
            </div>
            <h1 class="text-7xl md:text-9xl font-extrabold tracking-tighter leading-none">
                Discover.<br>Define.<br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#B39DDB] to-[#7E57C2]">Dominate.</span>
            </h1>
            <p class="text-slate-500 max-w-xl mx-auto text-lg font-light">
                The world is a dungeon. Your skills are your weapons. Initialize the Gemify System to map your evolution.
            </p>
            <div class="pt-8">
                <a href="#awakening" class="group relative inline-flex items-center gap-3 px-10 py-5 bg-white text-slate-900 font-bold rounded-full shadow-xl hover:shadow-2xl transition-all hover:-translate-y-1">
                    Begin Awakening
                </a>
            </div>
        </div>
    </section>

    <!-- PAGE 2: AWAKENING PAGE -->
    <section id="awakening" class="min-h-screen flex items-center justify-center px-6 relative">
        <div class="max-w-2xl w-full glass-card p-12 rounded-[40px] shadow-2xl border border-white">
            <div class="mb-10 text-center">
                <h2 class="text-4xl font-extrabold mb-4">State Your Ambition</h2>
                <p class="text-slate-400">The System will calculate your growth trajectory.</p>
            </div>

            <div class="space-y-6">
                <div class="relative">
                    <input type="text" id="ambitionInput" placeholder="e.g. Senior Software Architect..." 
                        class="w-full px-8 py-6 rounded-3xl bg-white/50 border-2 border-purple-50 focus:border-purple-200 focus:outline-none focus:ring-4 focus:ring-purple-100 transition-all text-xl font-medium">
                </div>

                <button onclick="initializeSystem()" class="w-full py-6 bg-slate-900 text-white font-black rounded-3xl shadow-2xl hover:bg-slate-800 transition-all flex items-center justify-center gap-4 group">
                    <span class="tracking-widest">INITIALIZE SYSTEM</span>
                </button>
            </div>
        </div>
    </section>

    <!-- FLOATING STATUS BUTTON (Initially Hidden) -->
    <button id="statusToggleBtn" onclick="openModal()" class="fixed right-6 top-1/2 -translate-y-1/2 z-40 hidden flex-col items-center gap-2 group">
        <div class="bg-white p-4 rounded-2xl shadow-2xl border border-purple-100 group-hover:bg-purple-500 transition-all duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-purple-500 group-hover:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
        </div>
        <span class="text-[10px] font-black text-purple-500 tracking-widest vertical-text uppercase">Status</span>
    </button>

    <!-- RESULT MODAL -->
    <div id="modalOverlay" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-500 z-40" onclick="closeModal()"></div>
    
    <aside id="resultModal" class="fixed top-0 right-0 h-full w-full md:w-[35%] bg-white/90 backdrop-blur-2xl border-l border-purple-100 shadow-2xl z-50 modal-transition translate-x-full overflow-y-auto">
        <div class="p-8 md:p-12">
            <!-- Modal Header -->
            <div class="flex justify-between items-center mb-12">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-purple-100 flex items-center justify-center">
                        <div class="w-3 h-3 rounded-full bg-purple-500 animate-pulse"></div>
                    </div>
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest">System Interface</h3>
                </div>
                <!-- Minimize Button -->
                <button onclick="closeModal()" class="group flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-full transition-all">
                    <span class="text-[10px] font-bold text-slate-500">MINIMIZE</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>

            <!-- System Log Terminal -->
            <div id="terminal" class="system-terminal rounded-2xl p-6 mb-10 hidden">
                <div id="logContent" class="text-xs leading-relaxed space-y-1"></div>
            </div>

            <!-- Evolution Path Content -->
            <div id="evolutionPath" class="hidden space-y-10">
                <div class="border-b border-purple-50 pb-8">
                    <h2 id="displayAmbition" class="text-3xl font-black text-slate-900 uppercase tracking-tighter mb-4"></h2>
                    <div class="flex items-center gap-4">
                        <span class="px-4 py-1 bg-slate-900 text-white text-[10px] font-black rounded-md tracking-widest">E-RANK</span>
                        <div class="flex-1 h-1 bg-purple-100 rounded-full overflow-hidden">
                            <div class="w-1/12 h-full bg-purple-500"></div>
                        </div>
                        <span class="text-[10px] font-bold text-slate-400">0/100 XP</span>
                    </div>
                </div>
                <div id="stageContainer" class="space-y-8"></div>
            </div>
        </div>
    </aside>

    <script>
        const ambitionInput = document.getElementById('ambitionInput');
        const resultModal = document.getElementById('resultModal');
        const modalOverlay = document.getElementById('modalOverlay');
        const statusToggleBtn = document.getElementById('statusToggleBtn');
        const terminal = document.getElementById('terminal');
        const logContent = document.getElementById('logContent');
        const evolutionPath = document.getElementById('evolutionPath');
        const stageContainer = document.getElementById('stageContainer');

        let isInitialized = false;

        function openModal() {
            resultModal.classList.remove('translate-x-full');
            modalOverlay.classList.remove('opacity-0', 'pointer-events-none');
            statusToggleBtn.classList.add('hidden'); // 打开时隐藏悬浮按钮
        }

        function closeModal() {
            resultModal.classList.add('translate-x-full');
            modalOverlay.classList.add('opacity-0', 'pointer-events-none');
            if (isInitialized) {
                statusToggleBtn.classList.remove('hidden');
                statusToggleBtn.classList.add('status-btn-appear');
            }
        }

        async function initializeSystem() {
            const ambition = ambitionInput.value.trim();
            if (!ambition) return alert("Please enter your ambition.");

            // 重置状态
            isInitialized = false;
            statusToggleBtn.classList.add('hidden');
            document.getElementById('displayAmbition').innerText = ambition;
            stageContainer.innerHTML = '';
            logContent.innerHTML = '';
            terminal.classList.remove('hidden');
            evolutionPath.classList.add('hidden');
            
            openModal();

            // 模拟系统日志
            const logs = ["[Analyzing Ambition...]", "[Calculating XP Nodes...]", "[Mapping Evolution Path...]", "[Awakening Complete.]"];
            for (const log of logs) {
                const line = document.createElement('div');
                line.innerHTML = `<span class="text-purple-500">>></span> ${log}`;
                logContent.appendChild(line);
                await new Promise(r => setTimeout(r, 500));
            }

            await new Promise(r => setTimeout(r, 500));
            terminal.classList.add('hidden');
            generatePath(ambition);
            evolutionPath.classList.remove('hidden');
            isInitialized = true;
        }

        function generatePath(ambition) {
            const stages = [
                { title: "Stage 1: Foundation", tasks: [{n: `Study ${ambition} basics`, x: 20}, {n: "Daily Practice", x: 10}] },
                { title: "Stage 2: Advanced", tasks: [{n: "Real-world Project", x: 50}, {n: "Skill Refinement", x: 30}] }
            ];

            stages.forEach((s, i) => {
                const html = `
                    <div class="space-y-4">
                        <h4 class="text-[10px] font-black text-purple-400 uppercase tracking-widest">Stage 0${i+1}</h4>
                        <h3 class="text-lg font-bold text-slate-800">${s.title}</h3>
                        <div class="space-y-2">
                            ${s.tasks.map(t => `
                                <div class="flex justify-between items-center p-4 bg-purple-50/50 rounded-2xl border border-purple-50">
                                    <span class="text-sm font-medium text-slate-600">${t.n}</span>
                                    <span class="text-[10px] font-black text-purple-500">+${t.x} XP</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
                stageContainer.insertAdjacentHTML('beforeend', html);
            });
        }
    </script>
</body>
</html>
