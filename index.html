<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemify | Ambition Pilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --lilac: #E6E6FA;
            --pastel-purple: #B39DDB;
            --deep-purple: #7E57C2;
            --glass: rgba(255, 255, 255, 0.7);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--lilac);
            color: #2D3748;
            overflow-x: hidden;
        }

        /* Fluid Typography */
        .fluid-h1 { font-size: clamp(2.5rem, 8vw, 6rem); line-height: 1; }
        .fluid-h2 { font-size: clamp(1.5rem, 4vw, 3rem); }

        /* Organic-Digital Tree Animation */
        .tree-node {
            animation: pulse-node 3s infinite ease-in-out;
            filter: drop-shadow(0 0 8px var(--pastel-purple));
        }
        @keyframes pulse-node {
            0%, 100% { r: 4; opacity: 0.6; }
            50% { r: 7; opacity: 1; }
        }
        .branch {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw-branch 4s forwards ease-out;
        }
        @keyframes draw-branch { to { stroke-dashoffset: 0; } }

        /* Portal Transition */
        .portal-transition {
            transition: all 0.8s cubic-bezier(0.7, 0, 0.3, 1);
        }
        .hidden-state { opacity: 0; transform: scale(0.9) translateY(20px); pointer-events: none; }

        /* Glassmorphism */
        .glass {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .system-log-glass {
            background: rgba(179, 157, 219, 0.15);
            border: 1px solid var(--pastel-purple);
            color: var(--deep-purple);
            font-family: 'Fira Code', monospace;
        }

        /* Responsive Modal */
        .modal-container {
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @media (max-width: 768px) {
            .modal-container { width: 92% !important; right: 4% !important; }
        }
    </style>
</head>
<body>

    <!-- PAGE 1: HERO SECTION -->
    <section id="heroPage" class="min-h-screen flex flex-col md:flex-row items-center justify-center p-6 md:p-20 gap-12 portal-transition">
        <!-- The Organic-Digital Tree -->
        <div class="w-full md:w-1/2 flex justify-center items-center">
            <svg viewBox="0 0 400 500" class="w-full max-w-[400px] h-auto drop-shadow-2xl">
                <!-- Trunk -->
                <path d="M200 450 Q200 300 200 150" stroke="#B39DDB" stroke-width="8" fill="none" class="branch" />
                <!-- Branches -->
                <path d="M200 350 Q100 300 80 200" stroke="#B39DDB" stroke-width="4" fill="none" class="branch" style="animation-delay: 0.5s" />
                <path d="M200 300 Q300 250 320 150" stroke="#B39DDB" stroke-width="4" fill="none" class="branch" style="animation-delay: 1s" />
                <path d="M200 200 Q150 100 200 50" stroke="#B39DDB" stroke-width="4" fill="none" class="branch" style="animation-delay: 1.5s" />
                <!-- Digital Nodes -->
                <circle cx="80" cy="200" r="5" fill="#7E57C2" class="tree-node" />
                <circle cx="320" cy="150" r="5" fill="#7E57C2" class="tree-node" style="animation-delay: 0.7s" />
                <circle cx="200" cy="50" r="5" fill="#7E57C2" class="tree-node" style="animation-delay: 1.4s" />
                <circle cx="140" cy="250" r="4" fill="#B39DDB" class="tree-node" style="animation-delay: 2s" />
            </svg>
        </div>

        <!-- Typography -->
        <div class="w-full md:w-1/2 text-center md:text-left space-y-6">
            <div class="space-y-2">
                <h2 class="text-sm font-black tracking-[0.4em] text-purple-500 uppercase">Ambition Pilot</h2>
                <h1 class="fluid-h1 font-extrabold text-slate-900 tracking-tighter">GEMIFY</h1>
                <p class="fluid-h2 font-light text-slate-500 leading-tight">Discover. Define. Dominate.</p>
            </div>
            <button onclick="enterSystem()" class="min-h-[56px] px-10 py-4 bg-slate-900 text-white font-bold rounded-full hover:bg-purple-600 transition-all shadow-2xl flex items-center justify-center gap-3 mx-auto md:mx-0">
                ENTER THE SYSTEM
                <i data-lucide="zap" class="w-5 h-5"></i>
            </button>
        </div>
    </section>

    <!-- PAGE 2: AWAKENING SYSTEM -->
    <main id="awakeningPage" class="fixed inset-0 hidden opacity-0 flex flex-col md:flex-row portal-transition">
        
        <!-- SIDEBAR (Desktop: Left, Mobile: Top) -->
        <aside class="w-full md:w-[300px] glass border-b md:border-r border-white/50 p-6 md:p-8 flex flex-row md:flex-col items-center md:items-start justify-between md:justify-start gap-6 z-20">
            <div class="flex items-center gap-4">
                <div id="roleIcon" class="w-12 h-12 rounded-2xl bg-slate-900 flex items-center justify-center text-white shadow-lg">
                    <i data-lucide="user"></i>
                </div>
                <div class="hidden md:block">
                    <h3 id="statName" class="font-bold text-slate-800">Player</h3>
                    <span id="rankBadge" class="text-[10px] font-black px-2 py-0.5 bg-purple-500 text-white rounded">E RANK</span>
                </div>
            </div>

            <div class="flex-1 md:w-full space-y-2">
                <div class="flex justify-between text-[10px] font-black text-slate-400 uppercase">
                    <span>XP Progress</span>
                    <span id="xpText">0/100</span>
                </div>
                <div class="w-full h-2 bg-white/50 rounded-full overflow-hidden">
                    <div id="xpBar" class="h-full bg-purple-500 transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="hidden md:block w-full pt-6">
                <h4 class="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">Rank Guide</h4>
                <div class="space-y-2 text-xs">
                    <div class="flex justify-between p-2 rounded-lg bg-white/30"><span>E Rank</span><span>Base</span></div>
                    <div class="flex justify-between p-2 rounded-lg bg-white/30"><span>D Rank</span><span>100 XP</span></div>
                    <div class="flex justify-between p-2 rounded-lg bg-white/30"><span>C Rank</span><span>200 XP</span></div>
                </div>
            </div>
        </aside>

        <!-- MAIN SETUP -->
        <section class="flex-1 flex flex-col items-center justify-center p-6 md:p-12">
            <div class="max-w-xl w-full glass p-8 md:p-12 rounded-[2.5rem] shadow-2xl space-y-8">
                <div class="text-center md:text-left">
                    <h2 class="text-3xl font-extrabold text-slate-900">System Awakening</h2>
                    <p class="text-slate-500">Initialize your evolution parameters.</p>
                </div>

                <div class="space-y-4">
                    <input type="text" id="inputName" placeholder="Player Name" class="w-full min-h-[56px] px-6 rounded-2xl bg-white/50 border border-purple-100 outline-none focus:ring-2 focus:ring-purple-400 transition-all">
                    <select id="inputGender" class="w-full min-h-[56px] px-6 rounded-2xl bg-white/50 border border-purple-100 outline-none focus:ring-2 focus:ring-purple-400 transition-all">
                        <option value="male">Warrior (Male)</option>
                        <option value="female">Mage (Female)</option>
                        <option value="neutral">Architect (Neutral)</option>
                    </select>
                    <input type="text" id="inputAmbition" placeholder="Core Ambition" class="w-full min-h-[56px] px-6 rounded-2xl bg-white/50 border border-purple-100 outline-none focus:ring-2 focus:ring-purple-400 transition-all">
                    
                    <button onclick="initializeEvolution()" class="w-full min-h-[56px] bg-slate-900 text-white font-black rounded-2xl shadow-xl hover:bg-purple-600 transition-all">
                        INITIALIZE
                    </button>
                </div>
            </div>
        </section>

        <!-- RESULT MODAL (35% Desktop, 92% Mobile) -->
        <aside id="resultModal" class="fixed top-4 right-4 bottom-4 w-[35%] glass rounded-[2.5rem] shadow-2xl border border-white/50 z-50 modal-container translate-x-[120%] flex flex-col overflow-hidden">
            <div class="p-6 md:p-8 flex justify-between items-center border-b border-purple-100">
                <h3 class="font-black text-slate-800 uppercase tracking-tighter">Evolution Path</h3>
                <button onclick="toggleModal(false)" class="p-2 bg-purple-50 text-purple-400 rounded-xl hover:bg-purple-100">
                    <i data-lucide="minimize-2"></i>
                </button>
            </div>

            <div id="logContainer" class="mx-6 mt-6 p-4 system-log-glass rounded-xl h-32 overflow-y-auto text-[10px] leading-relaxed">
                <p>[System: Awaiting Input...]</p>
            </div>

            <div id="taskContainer" class="flex-1 overflow-y-auto p-6 md:p-8 space-y-6">
                <!-- Tasks injected here -->
            </div>
        </aside>

        <!-- MINIMIZED TAB -->
        <button id="statusTab" onclick="toggleModal(true)" class="fixed right-0 top-1/2 -translate-y-1/2 bg-slate-900 text-white p-3 rounded-l-xl shadow-2xl z-40 hidden">
            <i data-lucide="layout-dashboard"></i>
        </button>
    </main>

    <script>
        lucide.createIcons();

        function enterSystem() {
            const hero = document.getElementById('heroPage');
            const awakening = document.getElementById('awakeningPage');
            hero.classList.add('hidden-state');
            setTimeout(() => {
                hero.classList.add('hidden');
                awakening.classList.remove('hidden');
                setTimeout(() => awakening.classList.remove('opacity-0'), 50);
            }, 800);
        }

        function toggleModal(show) {
            const modal = document.getElementById('resultModal');
            const tab = document.getElementById('statusTab');
            modal.style.transform = show ? 'translateX(0)' : 'translateX(120%)';
            tab.classList.toggle('hidden', show);
        }

        async function initializeEvolution() {
            const name = document.getElementById('inputName').value || "Player";
            const ambition = document.getElementById('inputAmbition').value;
            if (!ambition) return alert("Please state your ambition.");

            document.getElementById('statName').innerText = name;
            toggleModal(true);
            await runLogs(ambition);
            generateTasks(ambition);
        }

        async function runLogs(ambition) {
            const logs = [`[Gemify: Scanning Potential...]`, `[System: Mapping "${ambition}"...]`, `[System: Evolution Path Ready.]` ];
            const container = document.getElementById('logContainer');
            container.innerHTML = '';
            for (const log of logs) {
                const p = document.createElement('p');
                p.innerText = log;
                container.appendChild(p);
                container.scrollTop = container.scrollHeight;
                await new Promise(r => setTimeout(r, 600));
            }
        }

        function generateTasks(ambition) {
            const container = document.getElementById('taskContainer');
            container.innerHTML = `<h4 class="text-[10px] font-black text-purple-400 uppercase tracking-widest">Stage 1: Awakening</h4>`;
            
            const tasks = [
                { t: `Research fundamentals of ${ambition}`, xp: 20, link: "https://youtube.com" },
                { t: "Establish a 1-hour focus block", xp: 15, link: "https://coursera.org" }
            ];

            tasks.forEach(task => {
                const div = document.createElement('div');
                div.className = "flex items-start gap-4 p-4 rounded-2xl bg-white/50 border border-purple-50";
                div.innerHTML = `
                    <input type="checkbox" class="w-6 h-6 rounded-lg border-purple-200 text-purple-600" onchange="updateXP(${task.xp}, this)">
                    <div class="flex-1">
                        <p class="text-sm font-bold text-slate-700">${task.t}</p>
                        <a href="${task.link}" target="_blank" class="text-[10px] text-purple-400 font-bold">[Learn here: Link]</a>
                    </div>
                    <span class="text-[10px] font-black text-slate-400">+${task.xp}XP</span>
                `;
                container.appendChild(div);
            });
        }

        let currentXP = 0;
        function updateXP(amount, cb) {
            currentXP += cb.checked ? amount : -amount;
            document.getElementById('xpText').innerText = `${currentXP}/100`;
            document.getElementById('xpBar').style.width = `${Math.min(currentXP, 100)}%`;
        }

        // Enter Key Support
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (!document.getElementById('heroPage').classList.contains('hidden')) enterSystem();
                else initializeEvolution();
            }
        });
    </script>
</body>
</html>
