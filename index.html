<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090910;
            --bg-gradient: linear-gradient(135deg, #090910 0%, #1a0b2e 100%);
            --neon-purple: #bd00ff;
            --neon-blue: #00b8ff;
            --neon-pink: #ff00a8;
            --text-glow: 0 0 10px rgba(189,0,255,0.8), 0 0 20px rgba(189,0,255,0.4);
            --glass: rgba(20, 20, 30, 0.7);
            --glass-border: rgba(189, 0, 255, 0.3);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-dark);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Futuristic Grid Floor */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(var(--glass-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--glass-border) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: center;
            mask-image: radial-gradient(ellipse at center, black, transparent 80%);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        /* Neon Stroke Title */
        .hero-title {
            font-size: clamp(4rem, 12vw, 8rem);
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 2px var(--neon-purple);
            filter: drop-shadow(0 0 15px var(--neon-purple));
            letter-spacing: -0.05em;
            line-height: 1;
        }

        .subtitle-glow {
            text-transform: uppercase;
            letter-spacing: 0.5em;
            font-size: 0.75rem;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* Component Redesign */
        .glass {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 0 20px rgba(189, 0, 255, 0.1), 0 10px 30px rgba(0,0,0,0.5);
        }

        .neon-btn {
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue));
            color: white;
            font-weight: 800;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(189, 0, 255, 0.4);
            border: none;
            position: relative;
            overflow: hidden;
        }

        .neon-btn:hover {
            box-shadow: 0 0 30px rgba(189, 0, 255, 0.8);
            transform: translateY(-2px);
        }

        .role-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
        }

        .role-card.active {
            border-color: var(--neon-blue);
            background: rgba(0, 184, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 184, 255, 0.3), inset 0 0 10px rgba(0, 184, 255, 0.2);
        }

        /* Sidebar & Navigation */
        #sidebar {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 320px;
            border-right: 1px solid var(--glass-border);
        }
        #sidebar.collapsed { width: 0; padding: 0; opacity: 0; transform: translateX(-100%); }

        .sidebar-item {
            border: 1px solid transparent;
            background: rgba(255,255,255,0.02);
        }
        .sidebar-item.active {
            border-color: var(--neon-purple);
            background: rgba(189, 0, 255, 0.1);
            box-shadow: 0 0 15px rgba(189, 0, 255, 0.2);
        }

        .system-log-glass {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-family: 'Fira Code', monospace;
            text-shadow: 0 0 5px var(--neon-blue);
        }

        /* Global Fixed Logo */
        .fixed-site-logo {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 9999;
            pointer-events: none;
        }

        .portal-transition { transition: all 0.6s cubic-bezier(0.7, 0, 0.3, 1); }
        .hidden-state { opacity: 0; transform: scale(0.95) translateY(20px); pointer-events: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        input {
            background: rgba(0,0,0,0.3) !important;
            border: 1px solid var(--glass-border) !important;
            color: white !important;
        }
        input:focus {
            border-color: var(--neon-blue) !important;
            box-shadow: 0 0 15px rgba(0, 184, 255, 0.2) !important;
        }
    </style>
</head>
<body>

    <!-- GLOBAL NEON LOGO -->
    <div class="fixed-site-logo">
        <svg width="60" height="60" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="deep-purple-glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blurOut"/>
                    <feColorMatrix in="blurOut" type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.2  0 0 0 0 0.8  0 0 0 1 0" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            <g filter="url(#deep-purple-glow)" stroke="#bd00ff" stroke-width="2.5" fill="none">
                <path d="M100 30 L112 50 L100 70 L88 50 Z" fill="#bd00ff" stroke="none"/>
                <path d="M100 85 L100 180"/>
                <path d="M100 95 L85 80 M100 95 L115 80"/>
                <path d="M100 120 L75 95 L75 85 M100 120 L125 95 L125 85"/>
                <path d="M100 145 L60 115 L60 105 M100 145 L140 115 L140 105"/>
                <g fill="#00b8ff">
                    <circle cx="85" cy="80" r="3"/><circle cx="115" cy="80" r="3"/>
                    <circle cx="75" cy="85" r="3"/><circle cx="125" cy="85" r="3"/>
                </g>
            </g>
        </svg>
    </div>

    <!-- PAGE 1: HERO SECTION -->
    <section id="heroPage" class="fixed inset-0 flex flex-col md:flex-row items-center justify-center p-6 md:p-20 gap-12 z-[100] portal-transition">
        <div class="w-full md:w-1/2 flex justify-center items-center relative">
            <!-- NEW GLOWING CIRCUIT SVG -->
            <svg viewBox="0 0 400 500" class="w-full max-w-[450px] h-auto drop-shadow-[0_0_50px_rgba(189,0,255,0.3)]">
                <defs>
                    <filter id="neon-glow-filter" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
                        <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
                    </filter>
                    <linearGradient id="circuit-grad" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#bd00ff;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#00b8ff;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#ff00a8;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <g filter="url(#neon-glow-filter)" stroke="url(#circuit-grad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M200 450 L200 120" stroke-width="5" class="branch" />
                    <circle cx="200" cy="80" r="18" fill="url(#circuit-grad)" stroke="none" opacity="0.8" />
                    <circle cx="200" cy="80" r="10" fill="#ffffff" stroke="none" />
                    <path d="M200 380 C100 380 80 250 60 220" class="branch" />
                    <circle cx="60" cy="220" r="6" fill="#bd00ff" stroke="none" />
                    <path d="M200 300 C120 300 100 180 90 150" class="branch" />
                    <circle cx="90" cy="150" r="5" fill="#00b8ff" stroke="none" />
                    <path d="M200 380 C300 380 320 250 340 220" class="branch" />
                    <circle cx="340" cy="220" r="6" fill="#ff00a8" stroke="none" />
                    <path d="M200 300 C280 300 300 180 310 150" class="branch" />
                    <circle cx="310" cy="150" r="5" fill="#00b8ff" stroke="none" />
                </g>
            </svg>
        </div>
        <div class="w-full md:w-1/2 text-center md:text-left space-y-6 z-10">
            <h2 class="subtitle-glow">AI Evolution Engine</h2>
            <h1 class="hero-title">GEMIFY</h1>
            <p class="text-xl font-light text-slate-400">Discover. Define. Dominate.</p>
            <button onclick="enterSystem()" class="neon-btn px-12 py-5 rounded-full flex items-center gap-3 mx-auto md:mx-0">
                ENTER THE SYSTEM <i data-lucide="zap"></i>
            </button>
        </div>
    </section>

    <!-- PAGE 1.5: NAME ENTRY -->
    <section id="nameEntryPage" class="fixed inset-0 flex flex-col items-center justify-center p-6 z-[90] portal-transition hidden hidden-state">
        <div class="max-w-md w-full text-center space-y-8 glass p-12 rounded-[3rem]">
            <div class="w-20 h-20 bg-purple-900/30 border border-purple-500 rounded-3xl flex items-center justify-center mx-auto shadow-[0_0_20px_rgba(189,0,255,0.3)]">
                <i data-lucide="fingerprint" class="text-purple-400 w-10 h-10"></i>
            </div>
            <h2 class="text-3xl font-bold text-white">Identify Player</h2>
            <input type="text" id="inputName" placeholder="Enter your identity..." class="w-full p-6 text-center text-2xl font-bold rounded-3xl outline-none transition-all">
            <button onclick="proceedToAwakening()" class="neon-btn w-full py-4 rounded-full">AWAKEN IDENTITY</button>
        </div>
    </section>

    <!-- PAGE 2: MAIN APP -->
    <main id="appPage" class="flex h-screen opacity-0 pointer-events-none hidden portal-transition relative z-10">
        
        <button id="sidebarToggle" onclick="toggleSidebar()" class="fixed left-[335px] top-7 p-2 glass rounded-xl text-purple-400 hover:text-white transition-all">
            <i id="toggleIcon" data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>

        <aside id="sidebar" class="glass flex flex-col p-6 z-50 relative">
            <div class="mb-6 space-y-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div id="sidebarIcon" class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-600 to-blue-600 flex items-center justify-center text-white shadow-lg"><i data-lucide="user"></i></div>
                        <div>
                            <h3 id="statName" class="font-bold text-white text-sm">Player</h3>
                            <span id="rankBadge" class="text-[9px] font-black px-2 py-0.5 bg-purple-600 text-white rounded uppercase tracking-tighter">E Rank</span>
                        </div>
                    </div>
                    <button onclick="toggleRankGuide()" class="text-[10px] font-bold text-blue-400 uppercase tracking-widest hover:text-white">Ranks</button>
                </div>

                <div id="rankGuidePopover" class="absolute left-[330px] top-6 w-64 glass p-5 rounded-3xl shadow-2xl z-[100]">
                    <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Rank Progression</h4>
                    <div id="rankGuideList" class="space-y-2"></div>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between text-[10px] font-black text-slate-400 uppercase"><span>Global XP</span><span id="xpText" class="text-purple-400">0/100</span></div>
                    <div class="w-full h-1.5 bg-black/50 rounded-full overflow-hidden border border-white/10">
                        <div id="xpBar" class="h-full bg-gradient-to-r from-purple-500 to-blue-500 transition-all duration-1000" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <button onclick="createNewAmbition()" class="neon-btn flex items-center justify-center gap-2 w-full py-4 mb-8 rounded-2xl text-sm">
                <i data-lucide="plus" class="w-4 h-4"></i> New Ambition
            </button>

            <div class="flex-1 overflow-y-auto no-scrollbar space-y-6">
                <div><h4 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4 px-2">Ambition Vault</h4><div id="vaultList" class="space-y-2"></div></div>
                <div><h4 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4 px-2">Archived</h4><div id="archivedList" class="space-y-2 opacity-50"></div></div>
            </div>

            <div class="mt-auto pt-6 border-t border-white/10 space-y-2">
                <button onclick="logout()" class="w-full py-3 text-[11px] font-bold text-slate-400 uppercase tracking-widest hover:text-white transition-all">Logout</button>
                <button onclick="resetSystem()" class="w-full py-3 text-[11px] font-bold text-red-500/70 uppercase tracking-widest hover:text-red-400 transition-all">Reset System</button>
            </div>
        </aside>

        <section class="flex-1 flex flex-col items-center justify-center p-12 relative overflow-y-auto">
            <div id="setupForm" class="max-w-xl w-full glass p-10 rounded-[3rem] space-y-8">
                <div class="text-center"><h2 class="text-3xl font-extrabold text-white">Awakening System</h2><p class="text-slate-400 text-sm">Define your path and ambition</p></div>
                <div class="space-y-6">
                    <div class="space-y-2"><label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Select Role</label>
                        <div class="grid grid-cols-2 gap-4">
                            <div onclick="selectRole('Warrior')" id="role-Warrior" class="role-card active p-6 rounded-3xl flex flex-col items-center gap-3 cursor-pointer">
                                <div class="w-12 h-12 rounded-2xl bg-purple-900/30 flex items-center justify-center text-purple-400"><i data-lucide="sword"></i></div>
                                <span class="text-xs font-bold uppercase tracking-widest">Warrior</span>
                            </div>
                            <div onclick="selectRole('Mage')" id="role-Mage" class="role-card p-6 rounded-3xl flex flex-col items-center gap-3 cursor-pointer">
                                <div class="w-12 h-12 rounded-2xl bg-blue-900/30 flex items-center justify-center text-blue-400"><i data-lucide="wand-2"></i></div>
                                <span class="text-xs font-bold uppercase tracking-widest">Mage</span>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-2"><label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Core Ambition</label><input type="text" id="inputAmbition" placeholder="e.g. Master Software Architect" class="w-full p-6 rounded-3xl outline-none"></div>
                    <button id="initBtn" onclick="startEvolution()" class="neon-btn w-full py-5 rounded-3xl text-lg">INITIALIZE EVOLUTION</button>
                </div>
            </div>
            <div id="dashboard" class="hidden text-center space-y-6">
                <div class="w-24 h-24 glass rounded-[2rem] flex items-center justify-center mx-auto mb-6 animate-pulse border-blue-500/50 shadow-[0_0_30px_rgba(0,184,255,0.2)]">
                    <i data-lucide="shield-check" class="w-12 h-12 text-blue-400"></i>
                </div>
                <h1 id="activeTitle" class="text-5xl md:text-6xl font-black text-white uppercase leading-tight tracking-tighter"></h1>
                <p class="text-slate-400 max-w-md mx-auto">Evolution path is active. Complete tasks to increase your Rank.</p>
                <button onclick="toggleModal(true)" class="neon-btn px-10 py-4 rounded-full flex items-center gap-3 mx-auto">VIEW QUEST LOG <i data-lucide="layout-list"></i></button>
            </div>
        </section>

        <aside id="resultModal" class="fixed top-4 right-4 bottom-4 w-[38%] glass rounded-[2.5rem] z-[60] transition-transform duration-500 translate-x-[120%] flex flex-col overflow-hidden border-l border-white/10">
            <div class="p-6 border-b border-white/10 flex justify-between items-center">
                <h3 class="font-black text-white uppercase text-xs tracking-widest">Evolution Path</h3>
                <button onclick="toggleModal(false)" class="p-2 hover:bg-white/10 rounded-xl transition-all"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div id="logContainer" class="mx-6 mt-6 p-5 system-log-glass rounded-3xl h-32 overflow-y-auto text-[11px] leading-relaxed"></div>
            <div id="taskContainer" class="flex-1 overflow-y-auto p-6 space-y-6 no-scrollbar"></div>
        </aside>
    </main>

    <script>
        // --- BACKGROUND AI CONFIG ---
        const _part1 = "AIzaSyC1DSvs";
        const _part2 = "fpU_xlUf4yYro";
        const _part3 = "9UXcj_XgfR9s10";
        const _0x4a2 = _part1 + _part2 + _part3; 
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${_0x4a2}`;

        let session = { playerName: "", playerRole: "Warrior", currentId: null, ambitionVault: [], archivedVault: [] };
        const rankThresholds = [
            { rank: 'E', xp: 0 }, { rank: 'D', xp: 100 }, { rank: 'C', xp: 300 }, { rank: 'B', xp: 600 },
            { rank: 'A', xp: 1000 }, { rank: 'S', xp: 1500 }, { rank: 'SS', xp: 2100 }, { rank: 'SSS', xp: 3000 }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons(); renderRankGuide();
            const saved = localStorage.getItem('gemify_neon_v1');
            if (saved) {
                session = JSON.parse(saved);
                if (session.ambitionVault.length > 0 || session.archivedVault.length > 0) {
                    document.getElementById('heroPage').classList.add('hidden');
                    const app = document.getElementById('appPage');
                    app.classList.remove('hidden');
                    setTimeout(() => app.classList.remove('opacity-0', 'pointer-events-none'), 50);
                    renderVaults(); if (session.currentId) loadAmbition(session.currentId);
                }
            }
        });

        function save() { localStorage.setItem('gemify_neon_v1', JSON.stringify(session)); updateGlobalXP(); }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('sidebarToggle');
            const isCollapsed = sidebar.classList.toggle('collapsed');
            toggleBtn.style.left = isCollapsed ? '1.5rem' : '335px';
            document.getElementById('toggleIcon').setAttribute('data-lucide', isCollapsed ? 'chevron-right' : 'chevron-left');
            lucide.createIcons();
        }

        function enterSystem() {
            const hero = document.getElementById('heroPage');
            const nameEntry = document.getElementById('nameEntryPage');
            hero.classList.add('hidden-state');
            setTimeout(() => {
                hero.classList.add('hidden');
                if (session.playerName) {
                    proceedToAwakening();
                } else {
                    nameEntry.classList.remove('hidden');
                    setTimeout(() => nameEntry.classList.remove('hidden-state'), 50);
                    document.getElementById('inputName').focus();
                }
            }, 600);
        }

        function proceedToAwakening() {
            const name = document.getElementById('inputName').value.trim() || session.playerName;
            if (!name) return alert("Please state your identity.");
            session.playerName = name; save();
            const nameEntry = document.getElementById('nameEntryPage');
            const app = document.getElementById('appPage');
            nameEntry.classList.add('hidden-state');
            setTimeout(() => {
                nameEntry.classList.add('hidden');
                app.classList.remove('hidden');
                setTimeout(() => app.classList.remove('opacity-0', 'pointer-events-none'), 50);
                document.getElementById('statName').innerText = session.playerName;
                document.getElementById('inputAmbition').focus();
            }, 600);
        }

        function logout() {
            const hero = document.getElementById('heroPage');
            const app = document.getElementById('appPage');
            app.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                app.classList.add('hidden');
                hero.classList.remove('hidden', 'hidden-state');
            }, 600);
        }

        function resetSystem() {
            if (confirm("DANGER: This will clear ALL data. Continue?")) {
                localStorage.removeItem('gemify_neon_v1');
                location.reload();
            }
        }

        function toggleRankGuide() { document.getElementById('rankGuidePopover').classList.toggle('active'); }
        function toggleModal(show) { document.getElementById('resultModal').style.transform = show ? 'translateX(0)' : 'translateX(120%)'; }
        
        function renderRankGuide() {
            document.getElementById('rankGuideList').innerHTML = rankThresholds.map(r => `
                <div class="flex justify-between text-[11px] p-2 rounded-xl bg-white/5 border border-white/10">
                    <span class="font-bold text-slate-300">${r.rank} Rank</span><span class="font-black text-purple-400">${r.xp} XP</span>
                </div>`).reverse().join('');
        }

        function selectRole(role) {
            session.playerRole = role;
            document.getElementById('role-Warrior').classList.toggle('active', role === 'Warrior');
            document.getElementById('role-Mage').classList.toggle('active', role === 'Mage');
            updateSidebarIcon(role);
        }

        function updateSidebarIcon(role) {
            document.getElementById('sidebarIcon').innerHTML = `<i data-lucide="${role === 'Warrior' ? 'sword' : 'wand-2'}"></i>`;
            lucide.createIcons();
        }

        function createNewAmbition() {
            session.currentId = null;
            document.getElementById('setupForm').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('inputAmbition').value = '';
            document.getElementById('taskContainer').innerHTML = '';
            document.getElementById('logContainer').innerHTML = '<p class="text-blue-400 opacity-50">[System: Awaiting Input...]</p>';
            toggleModal(false); renderVaults();
        }

        async function fetchGeminiTasks(title, role) {
            const prompt = `You are the Gemify Evolution Engine. A user wants to master "${title}" as a ${role}. Break this goal into 5 HIGHLY SPECIFIC, technical, and humanized tasks. Return ONLY a JSON array: [{"phase": "...", "name": "...", "xp": number, "search": "..."}].`;
            try {
                const response = await fetch(API_URL, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                const text = data.candidates[0].content.parts[0].text;
                return JSON.parse(text.replace(/```json/g, "").replace(/```/g, "").trim());
            } catch (e) {
                return [
                    { phase: "Phase I: Neural Mapping", name: `Deconstruct the technical architecture of ${title}`, xp: 40, search: `${title} technicals` },
                    { phase: "Phase II: Core Execution", name: `Execute a 4-hour high-intensity practical drill in ${title}`, xp: 150, search: `${title} advanced drills` },
                    { phase: "Phase III: System Mastery", name: `Achieve a breakthrough milestone in ${title}`, xp: 500, search: `${title} masterclass` }
                ];
            }
        }

        async function startEvolution() {
            const title = document.getElementById('inputAmbition').value.trim();
            const btn = document.getElementById('initBtn');
            if (!title) return alert("State your ambition.");

            btn.disabled = true; btn.innerText = "AI THINKING..."; btn.classList.add('ai-loading');
            toggleModal(true); 
            document.getElementById('taskContainer').innerHTML = '';
            document.getElementById('logContainer').innerHTML = `<p class="text-purple-400">> [Gemify: Initializing Neural Link...]</p>`;

            const tasks = await fetchGeminiTasks(title, session.playerRole);
            const id = Date.now();
            session.ambitionVault.unshift({ id, title, role: session.playerRole, tasks: tasks.map(t => ({...t, completed: false})) });
            session.currentId = id;

            await runLogs(title);

            btn.disabled = false; btn.innerText = "INITIALIZE EVOLUTION"; btn.classList.remove('ai-loading');
            document.getElementById('activeTitle').innerText = title;
            document.getElementById('setupForm').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            renderTasks(session.ambitionVault[0]); renderVaults(); save();
        }

        async function runLogs(title) {
            const logs = [`[Engine: GEMINI_3_FLASH_ACTIVE]`, `[Analyzing "${title}" context...]`, `[Deconstructing mastery nodes...]`, `[Evolution Path Ready.]` ];
            const container = document.getElementById('logContainer');
            container.innerHTML = '';
            for (const log of logs) {
                const p = document.createElement('p'); p.innerText = `> ${log}`;
                container.appendChild(p); container.scrollTop = container.scrollHeight;
                await new Promise(r => setTimeout(r, 600));
            }
        }

        function loadAmbition(id) {
            session.currentId = id;
            const data = session.ambitionVault.find(a => a.id === id) || session.archivedVault.find(a => a.id === id);
            document.getElementById('statName').innerText = session.playerName;
            document.getElementById('activeTitle').innerText = data.title;
            document.getElementById('setupForm').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            updateSidebarIcon(data.role); renderTasks(data); renderVaults(); save();
        }

        function archiveAmbition(e, id) {
            e.stopPropagation();
            const idx = session.ambitionVault.findIndex(a => a.id === id);
            session.archivedVault.unshift(session.ambitionVault.splice(idx, 1)[0]);
            if (session.currentId === id) createNewAmbition();
            renderVaults(); save();
        }

        function unarchiveAmbition(e, id) {
            e.stopPropagation();
            const idx = session.archivedVault.findIndex(a => a.id === id);
            session.ambitionVault.unshift(session.archivedVault.splice(idx, 1)[0]);
            renderVaults(); save();
        }

        function renderVaults() {
            const activeList = document.getElementById('vaultList');
            const archivedList = document.getElementById('archivedList');
            activeList.innerHTML = ''; archivedList.innerHTML = '';
            session.ambitionVault.forEach(a => {
                const div = document.createElement('div');
                div.className = `sidebar-item p-4 rounded-2xl text-xs font-bold flex items-center justify-between group ${session.currentId === a.id ? 'active' : ''}`;
                div.onclick = () => loadAmbition(a.id);
                div.innerHTML = `<div class="flex items-center gap-3 truncate"><i data-lucide="target" class="w-4 h-4 text-purple-400"></i><span class="truncate text-white">${a.title}</span></div><button onclick="archiveAmbition(event, ${a.id})" class="opacity-0 group-hover:opacity-100 p-1 hover:bg-white/10 rounded-lg transition-all"><i data-lucide="archive" class="w-4 h-4 text-slate-400"></i></button>`;
                activeList.appendChild(div);
            });
            session.archivedVault.forEach(a => {
                const div = document.createElement('div');
                div.className = `sidebar-item p-4 rounded-2xl text-xs font-bold flex items-center justify-between group ${session.currentId === a.id ? 'active' : ''}`;
                div.onclick = () => loadAmbition(a.id);
                div.innerHTML = `<div class="flex items-center gap-3 truncate"><i data-lucide="package" class="w-4 h-4 text-slate-500"></i><span class="truncate text-slate-500">${a.title}</span></div><button onclick="unarchiveAmbition(event, ${a.id})" class="opacity-0 group-hover:opacity-100 p-1 hover:bg-white/10 rounded-lg transition-all"><i data-lucide="rotate-ccw" class="w-4 h-4 text-slate-400"></i></button>`;
                archivedList.appendChild(div);
            });
            lucide.createIcons();
        }

        function renderTasks(ambition) {
            const container = document.getElementById('taskContainer'); container.innerHTML = '';
            ambition.tasks.forEach((task, index) => {
                const div = document.createElement('div');
                div.className = "p-5 rounded-[1.5rem] bg-white/5 border border-white/10 flex items-start gap-4 shadow-xl";
                div.innerHTML = `
                    <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})" class="mt-1 w-6 h-6 rounded-lg border-purple-500 text-purple-600 bg-black/50">
                    <div class="flex-1">
                        <span class="task-phase-tag ${task.completed ? 'text-slate-500' : 'text-blue-400'} mb-2 inline-block">${task.phase}</span>
                        <p class="text-sm font-bold text-white leading-snug">${task.name}</p>
                        <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(task.search || task.name)}" target="_blank" class="text-[10px] text-purple-400 font-bold hover:text-white flex items-center gap-1 mt-2"><i data-lucide="external-link" class="w-3 h-3"></i> Learning Node</a>
                    </div><span class="text-[10px] font-black text-slate-500">+${task.xp}XP</span>`;
                container.appendChild(div);
            });
            lucide.createIcons();
        }

        function toggleTask(index) {
            const ambition = session.ambitionVault.find(a => a.id === session.currentId) || session.archivedVault.find(a => a.id === session.currentId);
            ambition.tasks[index].completed = !ambition.tasks[index].completed; save();
        }

        function updateGlobalXP() {
            let total = 0; [...session.ambitionVault, ...session.archivedVault].forEach(a => a.tasks.forEach(t => { if (t.completed) total += t.xp; }));
            let rankIdx = 0; rankThresholds.forEach((r, i) => { if (total >= r.xp) rankIdx = i; });
            const currentRank = rankThresholds[rankIdx]; const next = rankThresholds[rankIdx + 1] || {xp: 3000};
            document.getElementById('xpText').innerText = `${total}/${next.xp}`;
            document.getElementById('xpBar').style.width = `${Math.min((total / next.xp) * 100, 100)}%`;
            document.getElementById('rankBadge').innerText = `${currentRank.rank} RANK`;
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const heroPage = document.getElementById('heroPage');
                const nameEntryPage = document.getElementById('nameEntryPage');
                const setupForm = document.getElementById('setupForm');
                const initBtn = document.getElementById('initBtn');
                if (!heroPage.classList.contains('hidden')) { enterSystem(); } 
                else if (!nameEntryPage.classList.contains('hidden')) { proceedToAwakening(); }
                else if (!setupForm.classList.contains('hidden') && !initBtn.disabled) { startEvolution(); }
            }
        });
    </script>
</body>
</html>
