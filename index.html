<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemify | Evolution Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --lilac: #E6E6FA; 
            --pastel-purple: #B39DDB; 
            --deep-purple: #7E57C2; 
            --glass: rgba(255, 255, 255, 0.8); 
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #FDFCFE 0%, var(--lilac) 100%); 
            color: #2D3748; 
            overflow: hidden; 
            height: 100vh; 
        }

        /* Gemify Tree Background */
        .tree-bg { position: fixed; inset: 0; z-index: -1; opacity: 0.4; pointer-events: none; }
        .branch { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 4s forwards ease-out; }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        .tree-node { animation: pulse 3s infinite ease-in-out; fill: var(--deep-purple); }
        @keyframes pulse { 0%, 100% { opacity: 0.3; r: 3; } 50% { opacity: 0.8; r: 6; } }

        .glass { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); }
        
        /* Portal Transition */
        #portalOverlay {
            position: fixed; inset: 0; background: #000; z-index: 200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease; pointer-events: none; opacity: 0;
        }
        #portalOverlay.active { opacity: 1; pointer-events: auto; }

        .role-card { transition: all 0.3s ease; cursor: pointer; border: 2px solid transparent; }
        .role-card.active { border-color: var(--deep-purple); background: white; transform: translateY(-3px); }

        /* Mobile Drawer Logic */
        @media (max-width: 768px) {
            .quest-log-column {
                position: fixed; right: 0; top: 0; bottom: 0; width: 100% !important;
                transform: translateX(100%); transition: transform 0.4s ease; z-index: 100;
            }
            .quest-log-column.open { transform: translateX(0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <!-- PORTAL OVERLAY -->
    <div id="portalOverlay">
        <div class="w-16 h-16 border-4 border-purple-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <h2 class="text-white font-black tracking-[0.3em] uppercase text-sm">Syncing Soul...</h2>
    </div>

    <!-- BACKGROUND NODES -->
    <svg class="tree-bg" viewBox="0 0 800 800">
        <path d="M400 800 Q400 400 400 100" stroke="#B39DDB" stroke-width="2" fill="none" class="branch" />
        <circle cx="400" cy="100" r="5" class="tree-node" />
        <circle cx="300" cy="300" r="5" class="tree-node" style="animation-delay: 1s" />
        <circle cx="500" cy="250" r="5" class="tree-node" style="animation-delay: 2s" />
    </svg>

    <!-- STATE 0: HERO -->
    <section id="heroPage" class="fixed inset-0 flex flex-col items-center justify-center p-6 z-[100] bg-[#FDFCFE] transition-opacity duration-700">
        <div class="text-center space-y-6">
            <h2 class="text-xs font-black tracking-[0.5em] text-purple-500 uppercase">Gemify Evolution Engine</h2>
            <h1 class="text-8xl md:text-9xl font-extrabold text-slate-900 tracking-tighter">GEMIFY</h1>
            <p class="text-xl md:text-2xl font-light text-slate-500">Discover. Define. Dominate.</p>
            <button onclick="triggerPortal()" class="mt-8 px-12 py-5 bg-slate-900 text-white font-bold rounded-full hover:bg-purple-600 transition-all shadow-2xl flex items-center gap-3 mx-auto">
                ENTER THE SYSTEM <i data-lucide="zap"></i>
            </button>
        </div>
    </section>

    <!-- STATE 1: APP (3-COLUMN LAYOUT) -->
    <main id="appPage" class="hidden flex h-screen overflow-hidden opacity-0 transition-opacity duration-700">
        
        <!-- COLUMN 1: CHARACTER STATS -->
        <aside class="w-80 glass border-r p-6 flex flex-col gap-8">
            <div class="flex items-center gap-4">
                <div id="roleIcon" class="w-12 h-12 rounded-2xl bg-slate-900 text-white flex items-center justify-center shadow-lg"></div>
                <div>
                    <h3 id="displayPlayerName" class="font-bold text-slate-800">Player</h3>
                    <span id="rankBadge" class="text-[10px] font-black px-2 py-0.5 bg-purple-500 text-white rounded uppercase">E Rank</span>
                </div>
            </div>

            <div class="space-y-3">
                <div class="flex justify-between text-[10px] font-black text-slate-400 uppercase tracking-widest">
                    <span>Global XP</span>
                    <span id="xpCounter">0 / 100</span>
                </div>
                <div class="w-full h-2 bg-purple-100 rounded-full overflow-hidden">
                    <div id="xpBar" class="h-full bg-purple-500 transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>

            <nav class="flex-1 space-y-2 overflow-y-auto no-scrollbar">
                <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Ambition Vault</h4>
                <div id="vaultList" class="space-y-2"></div>
            </nav>

            <button onclick="logout()" class="flex items-center justify-center gap-2 w-full py-3 text-[11px] font-bold text-slate-400 uppercase tracking-widest hover:text-purple-500 transition-all">
                <i data-lucide="log-out" class="w-4 h-4"></i> Logout
            </button>
        </aside>

        <!-- COLUMN 2: INPUT FORM -->
        <section class="flex-1 flex flex-col items-center justify-center p-12 relative">
            <div id="inputArea" class="max-w-xl w-full glass p-10 rounded-[3rem] shadow-2xl space-y-8">
                <div class="text-center">
                    <h2 class="text-3xl font-extrabold text-slate-900">Initialize Evolution</h2>
                    <p class="text-slate-500 text-sm">Define your path to mastery</p>
                </div>
                
                <div class="space-y-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-2">Identity</label>
                        <input type="text" id="playerName" placeholder="Enter name..." class="w-full p-4 rounded-2xl bg-white/50 border border-purple-100 outline-none focus:ring-2 focus:ring-purple-400">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div onclick="setRole('Warrior')" id="roleWarrior" class="role-card active p-4 rounded-2xl glass flex flex-col items-center gap-2">
                            <i data-lucide="sword"></i><span class="text-[10px] font-bold uppercase">Warrior</span>
                        </div>
                        <div onclick="setRole('Mage')" id="roleMage" class="role-card p-4 rounded-2xl glass flex flex-col items-center gap-2">
                            <i data-lucide="wand-2"></i><span class="text-[10px] font-bold uppercase">Mage</span>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-2">Core Ambition</label>
                        <input type="text" id="ambitionInput" placeholder="e.g. Master Python" class="w-full p-4 rounded-2xl bg-white/50 border border-purple-100 outline-none focus:ring-2 focus:ring-purple-400">
                    </div>

                    <button onclick="generateQuest()" class="w-full py-5 bg-slate-900 text-white font-black rounded-2xl shadow-xl hover:bg-purple-600 transition-all">
                        SYNC AMBITION
                    </button>
                </div>
            </div>
        </section>

        <!-- COLUMN 3: QUEST LOG -->
        <aside id="questLog" class="quest-log-column w-[35%] glass border-l p-8 flex flex-col">
            <div class="flex justify-between items-center mb-8">
                <h3 class="font-black text-slate-800 uppercase text-xs tracking-widest">Active Quests</h3>
                <button onclick="toggleMobileLog()" class="md:hidden p-2 bg-purple-100 rounded-lg"><i data-lucide="x"></i></button>
            </div>
            <div id="questContainer" class="flex-1 overflow-y-auto space-y-4 no-scrollbar">
                <!-- Quest Cards Rendered Here -->
            </div>
        </aside>

    </main>

    <script>
        // --- CONFIG & STATE ---
        const STORAGE_KEY = 'gemify_session';
        let state = {
            playerName: "Player",
            playerRole: "Warrior",
            ambition_vault: []
        };

        // --- INITIALIZATION ---
        window.onload = () => {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                state = JSON.parse(saved);
                bypassToApp();
            }
            lucide.createIcons();
            
            // Key Binding
            document.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !document.getElementById('appPage').classList.contains('hidden')) {
                    generateQuest();
                }
            });
        };

        function save() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            updateUI();
        }

        // --- NAVIGATION ---
        function triggerPortal() {
            const overlay = document.getElementById('portalOverlay');
            overlay.classList.add('active');
            setTimeout(() => {
                document.getElementById('heroPage').classList.add('hidden');
                document.getElementById('appPage').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('appPage').classList.remove('opacity-0');
                    overlay.classList.remove('active');
                }, 50);
            }, 1500);
        }

        function bypassToApp() {
            document.getElementById('heroPage').classList.add('hidden');
            document.getElementById('appPage').classList.remove('hidden', 'opacity-0');
            updateUI();
        }

        function logout() {
            document.getElementById('appPage').classList.add('opacity-0');
            setTimeout(() => {
                document.getElementById('appPage').classList.add('hidden');
                document.getElementById('heroPage').classList.remove('hidden');
            }, 700);
        }

        // --- CORE LOGIC ---
        function setRole(role) {
            state.playerRole = role;
            document.getElementById('roleWarrior').classList.toggle('active', role === 'Warrior');
            document.getElementById('roleMage').classList.toggle('active', role === 'Mage');
        }

        async function generateQuest() {
            const ambition = document.getElementById('ambitionInput').value.trim();
            const name = document.getElementById('playerName').value.trim();
            if (!ambition) return;
            if (name) state.playerName = name;

            const verbs = state.playerRole === 'Warrior' 
                ? ['Strike', 'Execute', 'Command', 'Conquer', 'Fortify']
                : ['Analyze', 'Meditate', 'Synergize', 'Decipher', 'Optimize'];

            // Simulated AI Task Generation (Meeting constraints: <15 words, multiples of 5 XP)
            const newQuest = {
                id: Date.now(),
                title: ambition,
                role: state.playerRole,
                tasks: [
                    { name: `${verbs[0]} the fundamental architecture of ${ambition}`, xp: 25, completed: false },
                    { name: `${verbs[1]} a high-intensity 2-hour session`, xp: 50, completed: false },
                    { name: `${verbs[2]} the primary bottleneck in your workflow`, xp: 75, completed: false }
                ]
            };

            state.ambition_vault.unshift(newQuest);
            document.getElementById('ambitionInput').value = '';
            save();
        }

        function toggleTask(questId, taskIndex) {
            const quest = state.ambition_vault.find(q => q.id === questId);
            quest.tasks[taskIndex].completed = !quest.tasks[taskIndex].completed;
            save();
        }

        function deleteQuest(id) {
            state.ambition_vault = state.ambition_vault.filter(q => q.id !== id);
            save();
        }

        // --- UI RENDERING ---
        function updateUI() {
            document.getElementById('displayPlayerName').innerText = state.playerName;
            document.getElementById('roleIcon').innerHTML = `<i data-lucide="${state.playerRole === 'Warrior' ? 'sword' : 'wand-2'}"></i>`;
            
            renderVault();
            renderQuests();
            calculateProgression();
            lucide.createIcons();
        }

        function renderVault() {
            const container = document.getElementById('vaultList');
            container.innerHTML = state.ambition_vault.map(q => `
                <div class="p-3 rounded-xl bg-white/50 border border-purple-100 text-[11px] font-bold flex items-center gap-2">
                    <i data-lucide="target" class="w-3 h-3 text-purple-400"></i>
                    <span class="truncate">${q.title}</span>
                </div>
            `).join('');
        }

        function renderQuests() {
            const container = document.getElementById('questContainer');
            container.innerHTML = state.ambition_vault.map(q => `
                <div class="p-6 rounded-[2rem] bg-white shadow-xl border border-purple-50 space-y-4 relative group">
                    <button onclick="deleteQuest(${q.id})" class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-400 transition-all">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                    <div class="flex items-center gap-2">
                        <span class="px-2 py-0.5 bg-slate-100 text-[9px] font-black rounded uppercase text-slate-500">${q.role}</span>
                        <h4 class="font-extrabold text-slate-800 text-sm truncate">${q.title}</h4>
                    </div>
                    <div class="space-y-3">
                        ${q.tasks.map((t, i) => `
                            <div class="flex items-start gap-3">
                                <input type="checkbox" ${t.completed ? 'checked' : ''} 
                                    onchange="toggleTask(${q.id}, ${i})"
                                    class="mt-1 w-4 h-4 rounded border-purple-200 text-purple-600 focus:ring-purple-500">
                                <div class="flex-1">
                                    <p class="text-[11px] font-medium ${t.completed ? 'line-through text-slate-400' : 'text-slate-600'}">${t.name}</p>
                                    <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(t.name)}" target="_blank" class="text-[9px] text-purple-400 font-bold hover:underline">Learning Node →</a>
                                </div>
                                <span class="text-[9px] font-black text-slate-300">+${t.xp}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function calculateProgression() {
            let totalXP = 0;
            state.ambition_vault.forEach(q => {
                q.tasks.forEach(t => { if(t.completed) totalXP += t.xp; });
            });

            const ranks = [
                { r: 'E', min: 0, max: 99 },
                { r: 'D', min: 100, max: 299 },
                { r: 'C', min: 300, max: 599 },
                { r: 'B', min: 600, max: 999 },
                { r: 'A', min: 1000, max: 1499 },
                { r: 'S', min: 1500, max: 2099 },
                { r: 'SS', min: 2100, max: 10000 }
            ];

            const currentRank = ranks.find(r => totalXP >= r.min && totalXP <= r.max) || ranks[0];
            
            document.getElementById('rankBadge').innerText = `${currentRank.r} Rank`;
            document.getElementById('xpCounter').innerText = `${totalXP} / ${currentRank.max + 1}`;
            
            const progress = ((totalXP - currentRank.min) / (currentRank.max - currentRank.min + 1)) * 100;
            document.getElementById('xpBar').style.width = `${Math.min(progress, 100)}%`;
        }

        function toggleMobileLog() {
            document.getElementById('questLog').classList.toggle('open');
        }
    </script>
</body>
</html>
