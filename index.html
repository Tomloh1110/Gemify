<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemify | AI Evolution Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-dark: #0A0015; --bg-deep: #120025; --neon-purple: #9d72ff; 
            --neon-blue: #0038FF; --glass: rgba(10, 0, 21, 0.9);
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-dark); 
            color: #fff; overflow: hidden; height: 100vh;
        }
        /* 赛博朋克网格背景 */
        .grid-bg {
            position: fixed; inset: 0; z-index: -1;
            background-image: linear-gradient(rgba(157, 114, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(157, 114, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        /* 霓虹发光文字与边框 */
        .neon-text { color: transparent; -webkit-text-stroke: 1px var(--neon-purple); filter: drop-shadow(0 0 15px var(--neon-purple)); }
        .glass { background: var(--glass); backdrop-filter: blur(40px); border: 1px solid rgba(157, 114, 255, 0.2); }
        .portal-transition { transition: all 0.6s cubic-bezier(0.7, 0, 0.3, 1); }
        .hidden-state { opacity: 0; transform: scale(0.98) translateY(10px); pointer-events: none; }
        
        #sidebar { transition: all 0.5s ease; width: 320px; flex-shrink: 0; }
        #sidebar.collapsed { width: 0; padding: 0; opacity: 0; transform: scaleX(0); }
        #resultModal { transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); width: 32%; transform: translateX(110%); }
        #resultModal.active { transform: translateX(0); }
        #mainContentArea { flex: 1; display: flex; justify-content: center; align-items: center; overflow-y: auto; position: relative; }
        .role-card.active { border-color: var(--neon-purple); background: rgba(157, 114, 255, 0.1); box-shadow: 0 0 25px rgba(157, 114, 255, 0.3); }
        .system-log { font-family: 'Fira Code', monospace; background: rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <section id="heroPage" class="fixed inset-0 flex flex-col md:flex-row items-center justify-center p-10 gap-16 z-[100] portal-transition">
        <div class="w-full md:w-1/2 flex justify-center">
            <svg viewBox="0 0 400 500" class="w-full max-w-[400px] drop-shadow-[0_0_30px_rgba(157,114,255,0.5)]">
                <g stroke="var(--neon-purple)" stroke-width="4" fill="none" stroke-linecap="round">
                    <path d="M200 450 V150" stroke-width="8" />
                    <circle cx="200" cy="100" r="15" fill="var(--neon-purple)" opacity="0.8"/>
                    <path d="M200 350 Q100 350 80 250" /> <circle cx="80" cy="250" r="6" fill="var(--neon-blue)"/>
                    <path d="M200 300 Q300 300 320 200" /> <circle cx="320" cy="200" r="6" fill="var(--neon-purple)"/>
                </g>
            </svg>
        </div>
        <div class="w-full md:w-1/2 text-center md:text-left space-y-6">
            <h2 class="text-xs font-black tracking-[0.6em] text-purple-400 uppercase">AI Evolution Engine</h2>
            <h1 class="text-8xl md:text-9xl font-black neon-text tracking-tighter">GEMIFY</h1>
            <p class="text-2xl font-light text-purple-200/60">Discover. Define. Dominate.</p>
            <button onclick="enterSystem()" class="px-12 py-5 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-black rounded-full hover:scale-105 transition-all shadow-[0_0_40px_rgba(157,114,255,0.4)] flex items-center gap-3 mx-auto md:mx-0">
                ENTER THE SYSTEM <i data-lucide="zap"></i>
            </button>
        </div>
    </section>

    <main id="appPage" class="flex h-screen opacity-0 pointer-events-none hidden portal-transition">
        <aside id="sidebar" class="glass border-r border-purple-500/20 flex flex-col p-6 z-50">
            <div class="mt-16 mb-8 space-y-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-purple-600 flex items-center justify-center text-white shadow-lg"><i data-lucide="user"></i></div>
                    <div><h3 id="statName" class="font-bold text-sm">Player</h3><span id="rankBadge" class="text-[9px] font-black px-2 py-0.5 bg-blue-600 rounded uppercase">E Rank</span></div>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between text-[10px] font-black text-purple-400 uppercase"><span>Global XP</span><span id="xpText">0/1000</span></div>
                    <div class="w-full h-1.5 bg-white/5 rounded-full overflow-hidden"><div id="xpBar" class="h-full bg-blue-500 transition-all duration-500" style="width: 0%"></div></div>
                </div>
            </div>
            <button onclick="location.reload()" class="w-full py-4 mb-6 bg-white/5 border border-white/10 rounded-2xl font-bold text-xs hover:bg-purple-600 transition-all">New Ambition</button>
            <div id="vaultList" class="flex-1 overflow-y-auto no-scrollbar space-y-3"></div>
        </aside>

        <section id="mainContentArea">
            <div id="setupForm" class="max-w-lg w-full glass p-10 rounded-[3rem] shadow-2xl space-y-8">
                <div class="text-center"><h2 class="text-3xl font-black">Awakening System</h2><p class="text-purple-300 text-xs opacity-60">Deconstruct ambition into 10-stage evolution</p></div>
                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div onclick="selectRole('Warrior')" id="role-Warrior" class="role-card active p-6 rounded-3xl glass text-center cursor-pointer border-2 border-transparent">Warrior</div>
                        <div onclick="selectRole('Mage')" id="role-Mage" class="role-card p-6 rounded-3xl glass text-center cursor-pointer border-2 border-transparent">Mage</div>
                    </div>
                    <input type="text" id="inputAmbition" placeholder="e.g. Master Game Developer" class="w-full p-4 rounded-2xl bg-white/5 border border-purple-500/30 text-white outline-none focus:ring-2 focus:ring-purple-500">
                    <button id="initBtn" onclick="startEvolution()" class="w-full py-5 bg-gradient-to-r from-purple-600 to-blue-600 font-black rounded-2xl shadow-xl">INITIALIZE EVOLUTION</button>
                </div>
            </div>
            <div id="dashboard" class="hidden text-center space-y-8">
                <h1 id="activeTitle" class="text-7xl font-black tracking-tighter uppercase neon-text"></h1>
                <div id="appSuggestions" class="flex flex-wrap justify-center gap-3"></div>
                <button onclick="toggleResult(true)" class="px-12 py-4 glass rounded-full font-bold hover:bg-white/10 transition-all">VIEW EVOLUTION PATH</button>
            </div>
        </section>

        <aside id="resultModal" class="fixed top-0 right-0 bottom-0 glass flex flex-col z-[60]">
            <div class="p-8 border-b border-purple-500/20 mt-16">
                <div class="flex items-center gap-2 mb-4"><div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div><h3 class="font-black uppercase text-xs tracking-widest">Neural Syncing</h3></div>
                <div id="logBox" class="p-4 system-log rounded-xl h-32 overflow-y-auto text-[10px] leading-relaxed text-purple-400"></div>
            </div>
            <div id="taskContainer" class="flex-1 overflow-y-auto p-8 space-y-4 no-scrollbar"></div>
        </aside>
    </main>

    <div id="proofModal" class="fixed inset-0 bg-black/90 backdrop-blur-xl hidden flex items-center justify-center p-6 z-[200]">
        <div class="max-w-md w-full glass p-8 rounded-[2.5rem] space-y-6 border border-purple-500/30">
            <h3 class="text-2xl font-black">Verify Effort</h3>
            <p class="text-xs text-purple-200 opacity-60">To ensure the integrity of your evolution, provide a summary or link of your achievement.</p>
            <textarea id="proofInput" class="w-full h-32 p-4 rounded-xl bg-white/5 border border-white/10 text-white text-sm outline-none" placeholder="What did you learn in this stage?"></textarea>
            <div class="flex gap-4">
                <button onclick="closeProof()" class="flex-1 py-4 bg-white/10 rounded-xl font-bold">Cancel</button>
                <button id="claimBtn" onclick="submitProof()" class="flex-1 py-4 bg-purple-600 rounded-xl font-black">CLAIM XP</button>
            </div>
        </div>
    </div>

    <script>
        // --- SECURITY & API CONFIG (Gemini 3 Integration) ---
        const _k = ["AIzaSyC1DSvs", "fpU_xlUf4yYro", "9UXcj_XgfR9s10"];
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${_k.join('')}`;

        let session = { playerName: "Player", playerRole: "Warrior", currentId: null, vault: [], totalXP: 0 };
        let activeTaskIdx = null;

        async function fetchGeminiTasks(title, role) {
            const logBox = document.getElementById('logBox');
            logBox.innerHTML += `<p>> Connecting to Gemini 3 Flash Preview...</p>`;
            
            const prompt = `You are Gemify Evolution Engine. Break down "${title}" for a ${role} into 10 SEQUENTIAL EVOLUTION STAGES.
            Requirements: 
            1. Return 10 stages exactly. 
            2. Professional Academy Link (W3Schools/MDN/GitHub/Docs). 
            3. Recommended Software/Tool.
            4. XP value (multiple of 10).
            ONLY return raw JSON: {"tasks": [{"stage": 1, "name": "...", "xp": 50, "url": "...", "tool": "..."}], "apps": ["App1", "App2"]}`;

            try {
                const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
                const data = await res.json();
                let text = data.candidates[0].content.parts[0].text;
                const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
                logBox.innerHTML += `<p class="text-green-400">> [SUCCESS] Evolution mapping complete.</p>`;
                return json;
            } catch (e) {
                logBox.innerHTML += `<p class="text-red-400">> [ERROR] API failure. Using local fallback.</p>`;
                return { tasks: Array.from({length: 10}, (_, i) => ({ stage: i+1, name: `Mastery Stage ${i+1}: Fundamentals`, xp: 100, url: "https://w3schools.com", tool: "Professional Browser" })), apps: ["Gemini AI", "Documentation"] };
            }
        }

        async function startEvolution() {
            const title = document.getElementById('inputAmbition').value.trim();
            if (!title) return;
            const btn = document.getElementById('initBtn'); btn.disabled = true; btn.innerText = "MAPPING NEURAL NODES...";
            
            toggleResult(true);
            const data = await fetchGeminiTasks(title, session.playerRole);
            const id = Date.now();
            session.vault.unshift({ id, title, role: session.playerRole, tasks: data.tasks.map(t => ({...t, completed: false})), apps: data.apps });
            session.currentId = id;
            
            document.getElementById('setupForm').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('activeTitle').innerText = title;
            renderTasks(session.vault[0]); renderApps(data.apps); updateUI();
            btn.disabled = false; btn.innerText = "INITIALIZE EVOLUTION";
        }

        function renderTasks(ambition) {
            const container = document.getElementById('taskContainer'); container.innerHTML = '';
            ambition.tasks.forEach((t, i) => {
                const div = document.createElement('div');
                div.className = `p-5 rounded-2xl glass ${t.completed ? 'opacity-40 border-green-500/50' : 'border-purple-500/30'}`;
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-2"><span class="text-[9px] font-black px-2 py-0.5 bg-purple-600 rounded">STAGE ${t.stage}</span><span class="text-[10px] text-purple-400">+${t.xp} XP</span></div>
                    <p class="text-sm font-bold mb-3">${t.name}</p>
                    <div class="flex gap-2 items-center">
                        <span class="text-[9px] px-2 py-1 bg-white/5 rounded">🛠 ${t.tool}</span>
                        <a href="${t.url}" target="_blank" class="text-[9px] text-blue-400 font-bold underline">Source Node</a>
                        ${t.completed ? '<i data-lucide="check-circle" class="w-4 h-4 text-green-500 ml-auto"></i>' : `<button onclick="openProof(${i})" class="ml-auto px-3 py-1 bg-white/10 rounded text-[9px] font-bold">Verify Effort</button>`}
                    </div>
                `;
                container.appendChild(div);
            });
            lucide.createIcons();
        }

        function openProof(idx) { activeTaskIdx = idx; document.getElementById('proofModal').classList.remove('hidden'); }
        function closeProof() { document.getElementById('proofModal').classList.add('hidden'); document.getElementById('proofInput').value = ''; }
        function submitProof() {
            const input = document.getElementById('proofInput').value.trim();
            if (input.length < 5) return alert("Please provide more substantial evidence.");
            const ambition = session.vault.find(a => a.id === session.currentId);
            const task = ambition.tasks[activeTaskIdx];
            task.completed = true; session.totalXP += task.xp;
            closeProof(); renderTasks(ambition); updateUI();
        }

        function updateUI() {
            document.getElementById('xpText').innerText = `${session.totalXP}/5000`;
            document.getElementById('xpBar').style.width = `${Math.min((session.totalXP/5000)*100, 100)}%`;
            const ranks = ["E", "D", "C", "B", "A", "S", "SS", "SSS"];
            document.getElementById('rankBadge').innerText = `${ranks[Math.min(Math.floor(session.totalXP/600), 7)]} Rank`;
        }

        function renderApps(apps) { document.getElementById('appSuggestions').innerHTML = apps.map(a => `<span class="px-4 py-2 bg-white/5 rounded-xl text-[10px] border border-white/10">🛠 ${a}</span>`).join(''); }
        function enterSystem() { document.getElementById('heroPage').classList.add('hidden-state'); setTimeout(() => { document.getElementById('heroPage').classList.add('hidden'); document.getElementById('appPage').classList.remove('hidden'); setTimeout(() => document.getElementById('appPage').classList.remove('opacity-0', 'pointer-events-none'), 50); }, 600); }
        function selectRole(role) { session.playerRole = role; document.getElementById('role-Warrior').classList.toggle('active', role === 'Warrior'); document.getElementById('role-Mage').classList.toggle('active', role === 'Mage'); }
        function toggleResult(show) { document.getElementById('resultModal').classList.toggle('active', show); }
        document.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });
    </script>
</body>
</html>
