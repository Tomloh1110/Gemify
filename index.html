<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemify | Evolution Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --lilac: #E6E6FA; --pastel-purple: #B39DDB; --deep-purple: #7E57C2; --glass: rgba(255, 255, 255, 0.8); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #FDFCFE 0%, var(--lilac) 100%); color: #2D3748; overflow: hidden; height: 100vh; }
        
        /* Gemify Tree Dynamic Background */
        .tree-bg { position: fixed; inset: 0; z-index: -1; opacity: 0.5; }
        .branch { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 4s forwards ease-out; }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        .tree-node { animation: pulse 3s infinite ease-in-out; fill: var(--pastel-purple); }
        @keyframes pulse { 0%, 100% { opacity: 0.4; r: 4; } 50% { opacity: 1; r: 7; } }

        .glass { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.5); }
        
        /* Portal Transition Overlay */
        #portalOverlay {
            position: fixed; inset: 0; background: #FDFCFE; z-index: 1000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner { width: 50px; height: 50px; border: 5px solid var(--lilac); border-top-color: var(--deep-purple); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .role-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; border: 2px solid transparent; }
        .role-card.active { border-color: var(--deep-purple); background: white; transform: translateY(-5px); box-shadow: 0 15px 30px rgba(179, 157, 219, 0.2); }
        
        .quest-card { animation: slideIn 0.5s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <!-- PORTAL OVERLAY -->
    <div id="portalOverlay">
        <div class="spinner mb-4"></div>
        <h2 class="text-slate-900 font-black tracking-[0.3em] uppercase text-sm">Syncing Soul...</h2>
    </div>

    <!-- BACKGROUND -->
    <svg class="tree-bg" viewBox="0 0 800 800">
        <path d="M400 800 Q400 400 400 100" stroke="#B39DDB" stroke-width="2" fill="none" class="branch" />
        <circle cx="400" cy="100" r="6" class="tree-node" />
        <circle cx="300" cy="350" r="6" class="tree-node" style="animation-delay: 1s" />
        <circle cx="550" cy="200" r="6" class="tree-node" style="animation-delay: 2s" />
    </svg>

    <!-- STATE 0: HERO SECTION -->
    <section id="heroPage" class="fixed inset-0 flex flex-col items-center justify-center p-6 z-[100] bg-[#FDFCFE]">
        <div class="text-center space-y-8">
            <div class="space-y-2">
                <h2 class="text-xs font-black tracking-[0.5em] text-purple-500 uppercase">Gemify Evolution Engine</h2>
                <h1 class="text-8xl md:text-9xl font-extrabold text-slate-900 tracking-tighter">GEMIFY</h1>
                <p class="text-xl md:text-2xl font-light text-slate-500">Discover. Define. Dominate.</p>
            </div>
            <button onclick="enterSystem()" class="px-12 py-5 bg-slate-900 text-white font-bold rounded-full hover:bg-purple-600 transition-all shadow-2xl flex items-center gap-3 mx-auto">
                ENTER THE SYSTEM <i data-lucide="zap"></i>
            </button>
        </div>
    </section>

    <!-- STATE 1: APP INTERFACE -->
    <main id="appPage" class="hidden flex h-screen overflow-hidden">
        
        <!-- LEFT: CHARACTER STATS -->
        <aside class="w-80 glass border-r p-8 flex flex-col">
            <div class="mb-10">
                <div class="flex items-center gap-4 mb-6">
                    <div id="roleIcon" class="w-14 h-14 rounded-2xl bg-slate-900 text-white flex items-center justify-center shadow-xl"></div>
                    <div>
                        <h3 id="statName" class="font-bold text-slate-800 text-lg">Player</h3>
                        <span id="rankBadge" class="text-[10px] font-black px-2 py-0.5 bg-purple-500 text-white rounded uppercase">E Rank</span>
                    </div>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between text-[10px] font-black text-slate-400 uppercase tracking-widest">
                        <span>Global XP</span>
                        <span id="xpText">0 / 100</span>
                    </div>
                    <div class="w-full h-2.5 bg-purple-100 rounded-full overflow-hidden">
                        <div id="xpBar" class="h-full bg-purple-500 transition-all duration-1000" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto no-scrollbar">
                <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Ambition Vault</h4>
                <div id="vaultList" class="space-y-3"></div>
            </div>

            <button onclick="logout()" class="mt-6 flex items-center justify-center gap-2 w-full py-3 text-[11px] font-bold text-slate-400 uppercase tracking-widest hover:text-red-400 transition-all">
                <i data-lucide="log-out" class="w-4 h-4"></i> Logout
            </button>
        </aside>

        <!-- CENTER: INPUT FORM -->
        <section class="flex-1 flex flex-col items-center justify-center p-12">
            <div id="setupForm" class="max-w-xl w-full glass p-10 rounded-[3rem] shadow-2xl space-y-8">
                <div class="text-center">
                    <h2 class="text-3xl font-extrabold text-slate-900">Initialize Evolution</h2>
                    <p class="text-slate-500 text-sm">AI-Powered Neural Mapping</p>
                </div>
                
                <div class="space-y-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-2">Identity</label>
                        <input type="text" id="inputName" placeholder="Enter your name..." class="w-full p-4 rounded-2xl bg-white/50 border border-purple-100 outline-none focus:ring-2 focus:ring-purple-400">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div onclick="selectRole('Warrior')" id="role-Warrior" class="role-card active p-6 rounded-3xl glass flex flex-col items-center gap-3">
                            <i data-lucide="sword" class="w-8 h-8"></i>
                            <span class="text-xs font-bold uppercase tracking-widest">Warrior</span>
                        </div>
                        <div onclick="selectRole('Mage')" id="role-Mage" class="role-card p-6 rounded-3xl glass flex flex-col items-center gap-3">
                            <i data-lucide="wand-2" class="w-8 h-8"></i>
                            <span class="text-xs font-bold uppercase tracking-widest">Mage</span>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-2">Core Ambition</label>
                        <input type="text" id="inputAmbition" placeholder="e.g. Master Quantum Physics" class="w-full p-4 rounded-2xl bg-white/50 border border-purple-100 outline-none focus:ring-2 focus:ring-purple-400">
                    </div>

                    <button id="syncBtn" onclick="startEvolution()" class="w-full py-5 bg-slate-900 text-white font-black rounded-2xl shadow-xl hover:bg-purple-600 transition-all">
                        SYNC WITH SYSTEM
                    </button>
                </div>
            </div>
        </section>

        <!-- RIGHT: QUEST LOG -->
        <aside class="w-[35%] glass border-l p-8 flex flex-col">
            <h3 class="font-black text-slate-800 uppercase text-xs tracking-widest mb-8">Active Evolution Quests</h3>
            <div id="questLog" class="flex-1 overflow-y-auto space-y-6 no-scrollbar">
                <!-- Quests will appear here -->
            </div>
        </aside>

    </main>

    <script>
        // --- SYSTEM CONFIG ---
        const API_KEY = "YOUR_GEMINI_API_KEY"; // 建议在生产环境通过后端转发，此处为演示逻辑
        const STORAGE_KEY = 'gemify_session';
        
        let session = {
            playerName: "Player",
            playerRole: "Warrior",
            ambition_vault: [] 
        };

        // --- INITIALIZATION ---
        window.onload = () => {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                session = JSON.parse(saved);
                bypassToApp();
            }
            lucide.createIcons();
        };

        function save() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
            renderUI();
        }

        // --- NAVIGATION ---
        function enterSystem() {
            const overlay = document.getElementById('portalOverlay');
            overlay.style.display = 'flex';
            setTimeout(() => {
                document.getElementById('heroPage').style.display = 'none';
                document.getElementById('appPage').classList.remove('hidden');
                overlay.style.display = 'none';
                renderUI();
            }, 1500);
        }

        function bypassToApp() {
            document.getElementById('heroPage').style.display = 'none';
            document.getElementById('appPage').classList.remove('hidden');
            renderUI();
        }

        function logout() {
            document.getElementById('appPage').classList.add('hidden');
            document.getElementById('heroPage').style.display = 'flex';
        }

        // --- CORE LOGIC ---
        function selectRole(role) {
            session.playerRole = role;
            document.querySelectorAll('.role-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`role-${role}`).classList.add('active');
        }

        async function startEvolution() {
            const ambition = document.getElementById('inputAmbition').value.trim();
            const name = document.getElementById('inputName').value.trim();
            if (!ambition) return;
            if (name) session.playerName = name;

            const btn = document.getElementById('syncBtn');
            btn.disabled = true;
            btn.innerText = "NEURAL MAPPING...";

            // AI Prompt Logic based on Role
            const toneVerbs = session.playerRole === 'Warrior' 
                ? "Strike, Execute, Command, Conquer" 
                : "Analyze, Meditate, Synergize, Decipher";

            // 模拟后台 AI 生成 (实际应用中替换为 fetch 调用)
            // 为了保证演示流畅，这里使用符合 Gemify 逻辑的生成器
            const tasks = [
                { name: `${session.playerRole === 'Warrior' ? 'Execute' : 'Analyze'} the core foundations of ${ambition}`, xp: 25, completed: false },
                { name: `Identify and eliminate 3 major bottlenecks in ${ambition}`, xp: 50, completed: false },
                { name: `Achieve a breakthrough milestone in ${ambition} proficiency`, xp: 100, completed: false }
            ];

            const newAmbition = {
                id: Date.now(),
                title: ambition,
                role: session.playerRole,
                tasks: tasks
            };

            session.ambition_vault.unshift(newAmbition);
            document.getElementById('inputAmbition').value = '';
            btn.disabled = false;
            btn.innerText = "SYNC WITH SYSTEM";
            save();
        }

        function toggleTask(ambitionId, taskIndex) {
            const ambition = session.ambition_vault.find(a => a.id === ambitionId);
            ambition.tasks[taskIndex].completed = !ambition.tasks[taskIndex].completed;
            save();
        }

        function deleteAmbition(id) {
            session.ambition_vault = session.ambition_vault.filter(a => a.id !== id);
            save();
        }

        // --- UI RENDERING ---
        function renderUI() {
            document.getElementById('statName').innerText = session.playerName;
            document.getElementById('roleIcon').innerHTML = `<i data-lucide="${session.playerRole === 'Warrior' ? 'sword' : 'wand-2'}"></i>`;
            
            // Render Vault
            const vaultList = document.getElementById('vaultList');
            vaultList.innerHTML = session.ambition_vault.map(a => `
                <div class="p-4 rounded-2xl bg-white/50 border border-purple-100 text-[11px] font-bold flex items-center gap-3">
                    <i data-lucide="target" class="w-3 h-3 text-purple-400"></i>
                    <span class="truncate">${a.title}</span>
                </div>
            `).join('');

            // Render Quests
            const questLog = document.getElementById('questLog');
            questLog.innerHTML = session.ambition_vault.map(a => `
                <div class="quest-card p-6 rounded-[2.5rem] bg-white shadow-xl border border-purple-50 relative group">
                    <button onclick="deleteAmbition(${a.id})" class="absolute top-6 right-6 opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-400 transition-all">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                    <div class="flex items-center gap-2 mb-4">
                        <span class="px-2 py-0.5 bg-purple-100 text-purple-500 text-[9px] font-black rounded uppercase">${a.role}</span>
                        <h4 class="font-extrabold text-slate-800 text-sm">${a.title}</h4>
                    </div>
                    <div class="space-y-4">
                        ${a.tasks.map((t, i) => `
                            <div class="flex items-start gap-3">
                                <input type="checkbox" ${t.completed ? 'checked' : ''} 
                                    onchange="toggleTask(${a.id}, ${i})"
                                    class="mt-1 w-5 h-5 rounded-lg border-purple-200 text-purple-600 focus:ring-purple-500">
                                <div class="flex-1">
                                    <p class="text-xs font-bold ${t.completed ? 'line-through text-slate-300' : 'text-slate-600'}">${t.name}</p>
                                    <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(t.name)}" target="_blank" class="text-[10px] text-purple-400 font-bold hover:underline">Learning Node →</a>
                                </div>
                                <span class="text-[10px] font-black text-slate-300">+${t.xp}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            calculateXP();
            lucide.createIcons();
        }

        function calculateXP() {
            let totalXP = 0;
            session.ambition_vault.forEach(a => {
                a.tasks.forEach(t => { if(t.completed) totalXP += t.xp; });
            });

            const ranks = [
                { r: 'E', min: 0, max: 99 },
                { r: 'D', min: 100, max: 299 },
                { r: 'C', min: 300, max: 599 },
                { r: 'B', min: 600, max: 999 },
                { r: 'A', min: 1000, max: 1499 },
                { r: 'S', min: 1500, max: 2099 },
                { r: 'SS', min: 2100, max: 99999 }
            ];

            const currentRank = ranks.find(r => totalXP >= r.min && totalXP <= r.max);
            document.getElementById('rankBadge').innerText = `${currentRank.r} Rank`;
            document.getElementById('xpText').innerText = `${totalXP} / ${currentRank.max + 1}`;
            
            const progress = ((totalXP - currentRank.min) / (currentRank.max - currentRank.min + 1)) * 100;
            document.getElementById('xpBar').style.width = `${progress}%`;
        }
    </script>
</body>
</html>
