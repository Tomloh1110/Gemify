<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemify | Ambition Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --lilac: #E6E6FA;
            --pastel-purple: #B39DDB;
            --deep-purple: #7E57C2;
            --glass: rgba(255, 255, 255, 0.7);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #FDFCFE 0%, var(--lilac) 100%);
            color: #2D3748;
            overflow: hidden;
            height: 100vh;
        }
        .glass { background: var(--glass); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .sidebar-item { transition: all 0.2s ease; cursor: pointer; border-radius: 12px; }
        .sidebar-item:hover { background: rgba(179, 157, 219, 0.2); }
        .sidebar-item.active { background: white; border: 1px solid var(--pastel-purple); box-shadow: 0 4px 12px rgba(179, 157, 219, 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .portal-transition { transition: all 0.6s cubic-bezier(0.7, 0, 0.3, 1); }
        .hidden-state { opacity: 0; transform: scale(0.95) translateY(20px); pointer-events: none; }
    </style>
</head>
<body>

    <!-- PAGE 1: HERO SECTION -->
    <section id="heroPage" class="fixed inset-0 flex flex-col items-center justify-center z-[100] bg-white portal-transition">
        <div class="text-center space-y-6">
            <h2 class="text-xs font-black tracking-[0.5em] text-purple-500 uppercase">System Awakening</h2>
            <h1 class="text-7xl md:text-9xl font-extrabold text-slate-900 tracking-tighter">GEMIFY</h1>
            <p class="text-xl font-light text-slate-500">Discover. Define. Dominate.</p>
            <button onclick="enterSystem()" class="px-10 py-4 bg-slate-900 text-white font-bold rounded-full hover:bg-purple-600 transition-all shadow-2xl">ENTER THE SYSTEM</button>
        </div>
    </section>

    <!-- MAIN APP LAYOUT -->
    <main id="appPage" class="flex h-screen opacity-0 portal-transition">
        
        <!-- SIDEBAR (Gemini Style) -->
        <aside id="sidebar" class="w-[300px] glass border-r border-white/50 flex flex-col p-4 z-50">
            <!-- Character Stats -->
            <div class="p-4 mb-4 bg-white/50 rounded-3xl border border-purple-100">
                <div class="flex items-center gap-3 mb-4">
                    <div id="roleIcon" class="w-10 h-10 rounded-xl bg-slate-900 flex items-center justify-center text-white">
                        <i data-lucide="user"></i>
                    </div>
                    <div>
                        <h3 id="statName" class="font-bold text-sm">Player</h3>
                        <span id="rankBadge" class="text-[9px] font-black px-2 py-0.5 bg-purple-500 text-white rounded uppercase">E Rank</span>
                    </div>
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-[9px] font-black text-slate-400 uppercase">
                        <span>Global XP</span>
                        <span id="xpText">0/100</span>
                    </div>
                    <div class="w-full h-1.5 bg-white rounded-full overflow-hidden">
                        <div id="xpBar" class="h-full bg-purple-500 transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- New Ambition Button -->
            <button onclick="createNewAmbition()" class="flex items-center gap-3 w-full p-4 mb-6 bg-slate-900 text-white rounded-2xl font-bold text-sm hover:bg-purple-600 transition-all shadow-lg">
                <i data-lucide="plus" class="w-4 h-4"></i> New Ambition
            </button>

            <!-- History List -->
            <div class="flex-1 overflow-y-auto no-scrollbar space-y-2">
                <h4 class="text-[10px] font-black text-slate-400 uppercase px-2 mb-2 tracking-widest">Ambition Vault</h4>
                <div id="vaultList" class="space-y-1">
                    <!-- History items injected here -->
                </div>
            </div>

            <!-- Reset -->
            <button onclick="resetSystem()" class="mt-4 p-3 text-[10px] font-bold text-red-400 uppercase tracking-widest hover:bg-red-50 rounded-xl transition-all">
                Reset System
            </button>
        </aside>

        <!-- CENTER CONTENT -->
        <section class="flex-1 flex flex-col items-center justify-center p-12 relative overflow-y-auto">
            
            <!-- Input Form (State: New) -->
            <div id="setupForm" class="max-w-xl w-full glass p-10 rounded-[3rem] shadow-2xl space-y-8">
                <div class="text-center">
                    <h2 class="text-3xl font-extrabold text-slate-900">Initialize Evolution</h2>
                    <p class="text-slate-500 text-sm">What is your core ambition?</p>
                </div>
                <div class="space-y-4">
                    <input type="text" id="inputName" placeholder="Player Name" class="w-full p-4 rounded-2xl bg-white/50 border border-purple-100 outline-none focus:ring-2 focus:ring-purple-400">
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="setRole('Warrior')" id="btnWarrior" class="p-4 rounded-2xl border-2 border-transparent bg-white/50 hover:border-purple-300 transition-all flex flex-col items-center gap-2">
                            <i data-lucide="sword" class="text-slate-700"></i><span class="text-xs font-bold">Warrior</span>
                        </button>
                        <button onclick="setRole('Mage')" id="btnMage" class="p-4 rounded-2xl border-2 border-transparent bg-white/50 hover:border-purple-300 transition-all flex flex-col items-center gap-2">
                            <i data-lucide="wand-2" class="text-slate-700"></i><span class="text-xs font-bold">Mage</span>
                        </button>
                    </div>
                    <input type="text" id="inputAmbition" placeholder="e.g. Master Software Architect" class="w-full p-4 rounded-2xl bg-white/50 border border-purple-100 outline-none focus:ring-2 focus:ring-purple-400">
                    <button onclick="startEvolution()" class="w-full py-4 bg-slate-900 text-white font-black rounded-2xl shadow-xl hover:bg-purple-600 transition-all">INITIALIZE</button>
                </div>
            </div>

            <!-- Dashboard (State: Active Ambition) -->
            <div id="dashboard" class="hidden text-center space-y-6">
                <div class="w-20 h-20 bg-white rounded-3xl shadow-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="shield-check" class="w-10 h-10 text-purple-500"></i>
                </div>
                <h1 id="activeTitle" class="text-5xl font-black text-slate-900 tracking-tighter uppercase"></h1>
                <p class="text-slate-500 max-w-md mx-auto">Evolution path is active. Check the Quest Log to proceed.</p>
                <button onclick="toggleModal(true)" class="px-8 py-4 bg-white text-slate-900 font-bold rounded-full shadow-lg hover:shadow-2xl transition-all">OPEN QUEST LOG</button>
            </div>
        </section>

        <!-- RIGHT MODAL (Quest Log) -->
        <aside id="questModal" class="fixed top-4 right-4 bottom-4 w-[35%] glass rounded-[2.5rem] shadow-2xl border border-white/50 z-[60] transition-transform duration-500 translate-x-[120%] flex flex-col overflow-hidden">
            <div class="p-6 border-b border-purple-100 flex justify-between items-center">
                <h3 class="font-black text-slate-800 uppercase text-xs tracking-widest">Quest Log</h3>
                <button onclick="toggleModal(false)" class="p-2 bg-purple-50 text-purple-400 rounded-xl"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div id="taskContainer" class="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar">
                <!-- Tasks injected here -->
            </div>
        </aside>

    </main>

    <script>
        // --- DATA ARCHITECTURE ---
        let session = {
            playerName: "Player",
            playerRole: "Warrior",
            currentId: null,
            ambitionVault: [] // Array of {id, title, role, tasks: [{name, xp, completed, url}]}
        };

        const rankThresholds = [
            { rank: 'E', xp: 0 }, { rank: 'D', xp: 100 }, { rank: 'C', xp: 300 },
            { rank: 'B', xp: 600 }, { rank: 'A', xp: 1000 }, { rank: 'S', xp: 1500 }, { rank: 'SS', xp: 2100 }
        ];

        // --- CORE LOGIC ---
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const saved = localStorage.getItem('gemify_session');
            if (saved) {
                session = JSON.parse(saved);
                if (session.ambitionVault.length > 0) {
                    enterSystem();
                    renderVault();
                    if (session.currentId) loadAmbition(session.currentId);
                }
            }
        });

        function save() {
            localStorage.setItem('gemify_session', JSON.stringify(session));
            updateGlobalXP();
        }

        function enterSystem() {
            document.getElementById('heroPage').classList.add('hidden-state');
            setTimeout(() => {
                document.getElementById('heroPage').classList.add('hidden');
                document.getElementById('appPage').classList.remove('opacity-0');
            }, 600);
        }

        function setRole(role) {
            session.playerRole = role;
            document.getElementById('btnWarrior').classList.toggle('active', role === 'Warrior');
            document.getElementById('btnMage').classList.toggle('active', role === 'Mage');
            document.getElementById('roleIcon').innerHTML = `<i data-lucide="${role === 'Warrior' ? 'sword' : 'wand-2'}"></i>`;
            lucide.createIcons();
        }

        function createNewAmbition() {
            session.currentId = null;
            document.getElementById('setupForm').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            toggleModal(false);
            renderVault();
        }

        function startEvolution() {
            const name = document.getElementById('inputName').value.trim();
            const title = document.getElementById('inputAmbition').value.trim();
            if (!title) return alert("State your ambition.");

            if (name) session.playerName = name;
            const id = Date.now();
            
            const newAmbition = {
                id: id,
                title: title,
                role: session.playerRole,
                tasks: [
                    { name: `Analyze core pillars of ${title}`, xp: 25, completed: false, url: `https://www.youtube.com/results?search_query=${title}+basics` },
                    { name: `Execute 1st deliberate practice`, xp: 20, completed: false, url: `https://www.youtube.com/results?search_query=${title}+tutorial` },
                    { name: `Decipher advanced strategies`, xp: 30, completed: false, url: `https://www.youtube.com/results?search_query=${title}+advanced` }
                ]
            };

            session.ambitionVault.unshift(newAmbition);
            loadAmbition(id);
            renderVault();
            save();
        }

        function loadAmbition(id) {
            session.currentId = id;
            const data = session.ambitionVault.find(a => a.id === id);
            
            document.getElementById('statName').innerText = session.playerName;
            document.getElementById('activeTitle').innerText = data.title;
            document.getElementById('setupForm').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            
            renderTasks(data);
            renderVault();
            save();
        }

        function renderVault() {
            const list = document.getElementById('vaultList');
            list.innerHTML = '';
            session.ambitionVault.forEach(ambition => {
                const div = document.createElement('div');
                div.className = `sidebar-item p-3 text-xs font-bold flex items-center gap-2 ${session.currentId === ambition.id ? 'active' : ''}`;
                div.onclick = () => loadAmbition(ambition.id);
                div.innerHTML = `<i data-lucide="message-square" class="w-3 h-3 opacity-50"></i> <span class="truncate">${ambition.title}</span>`;
                list.appendChild(div);
            });
            lucide.createIcons();
        }

        function renderTasks(ambition) {
            const container = document.getElementById('taskContainer');
            container.innerHTML = '';
            ambition.tasks.forEach((task, index) => {
                const div = document.createElement('div');
                div.className = "p-4 rounded-2xl bg-white/60 border border-purple-50 flex items-start gap-3";
                div.innerHTML = `
                    <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})" class="mt-1 w-5 h-5 rounded-lg border-purple-200 text-purple-600">
                    <div class="flex-1">
                        <p class="text-xs font-bold text-slate-700">${task.name}</p>
                        <a href="${task.url}" target="_blank" class="text-[9px] text-purple-400 font-black uppercase tracking-widest hover:underline">Learning Node</a>
                    </div>
                    <span class="text-[10px] font-black text-slate-400">+${task.xp}</span>
                `;
                container.appendChild(div);
            });
        }

        function toggleTask(index) {
            const ambition = session.ambitionVault.find(a => a.id === session.currentId);
            ambition.tasks[index].completed = !ambition.tasks[index].completed;
            save();
            updateGlobalXP();
        }

        function updateGlobalXP() {
            let total = 0;
            session.ambitionVault.forEach(a => {
                a.tasks.forEach(t => { if (t.completed) total += t.xp; });
            });

            let currentRank = 'E';
            rankThresholds.forEach(r => { if (total >= r.xp) currentRank = r.rank; });
            const next = rankThresholds.find(r => r.xp > total) || {xp: 2100};

            document.getElementById('xpText').innerText = `${total}/${next.xp}`;
            document.getElementById('xpBar').style.width = `${Math.min((total / next.xp) * 100, 100)}%`;
            document.getElementById('rankBadge').innerText = `${currentRank} RANK`;
        }

        function toggleModal(show) {
            document.getElementById('questModal').style.transform = show ? 'translateX(0)' : 'translateX(120%)';
        }

        function resetSystem() {
            if (confirm("Purge all data?")) {
                localStorage.removeItem('gemify_session');
                location.reload();
            }
        }
    </script>
</body>
</html>
